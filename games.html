<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png"/>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0a0a23" />
  <title>Games — Omotenashi Training</title>
  <style>
    :root {
      --bg-primary:#0a0a23; --bg-secondary:#1b1b32; --bg-tertiary:#2a2a4a;
      --accent-yellow:#f1be32; --accent-blue:#f1be32; --accent-blue-rgb:241,190,50; --accent-green:#1fad69; --accent-red:#c5442a;
      --text-primary:#ffffff; --text-secondary:#a3a3c2; --text-muted:#5f5f7a;
      --border-default:#2a2a4a; --border-strong:#4a4a6a;
      --accent-rgb:241,190,50; --transition:150ms ease;
      --font-sans:'Segoe UI',system-ui,sans-serif;
      --font-mono:'Cascadia Code','Fira Code','Consolas',monospace;

      --bg-p:#0a0a23; --bg-s:#1b1b32; --bg-t:#2a2a4a;
      --accent:#f1be32;
      --green:#1fad69; --red:#c5442a;
      --t-p:#fff; --t-s:#a3a3c2; --t-m:#5f5f7a;
      --border:#2a2a4a;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:18px}
    body{background:var(--bg-secondary);color:#fff;font-family:var(--font-sans);font-size:1rem;line-height:1.75;letter-spacing:normal;min-height:100vh}

    /* ── NAVBAR ── */
    .nav{position:fixed;top:0;left:0;right:0;z-index:200;height:60px;background:var(--bg-primary)}
    .nav-inner{max-width:100%;padding:0 32px;height:100%;display:flex;align-items:center;justify-content:space-between;position:relative}
    .main{max-width:700px;margin:0 auto;padding:84px 24px 72px}
    .gh-title{font-family:var(--font-mono);font-size:1.8rem;font-weight:700;color:var(--accent);text-align:center;margin:40px 0 8px}
    .gh-sub{font-size:0.85rem;color:var(--t-m);text-align:center;margin-bottom:32px}
    .gh-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:560px){.gh-grid{grid-template-columns:1fr}}
    .gh-card{background:var(--bg-p);border:1px solid var(--border);border-radius:10px;padding:24px;cursor:pointer;transition:border-color 0.2s,transform 0.15s;text-align:center}
    .gh-card:hover{border-color:rgba(var(--accent-rgb),0.4);transform:translateY(-2px)}
    .gh-icon{font-size:2.2rem;margin-bottom:8px}
    .gh-name{font-size:0.95rem;font-weight:700;color:var(--t-p);margin-bottom:4px}
    .gh-desc{font-size:0.78rem;color:var(--t-s);line-height:1.45}
    .gh-back{display:inline-block;padding:6px 14px;background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--t-s);font-size:0.8rem;cursor:pointer;font-family:inherit;margin-bottom:20px}
    .gh-back:hover{background:var(--bg-t);color:var(--t-p)}
    .g-title{font-family:var(--font-mono);font-size:1.15rem;font-weight:700;color:var(--accent);margin-bottom:16px}
    .g-area{background:var(--bg-p);border:1px solid var(--border);border-radius:10px;padding:28px;min-height:320px}
    .g-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
    .g-label{font-family:var(--font-mono);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--t-m)}
    .g-btn{padding:8px 18px;border-radius:5px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity 0.15s,background 0.15s}
    .g-btn:hover{opacity:0.85}
    .g-btn-p{background:var(--green);color:#fff;border:1px solid var(--green)}
    .g-btn-y{background:var(--accent);color:#0a0a23;border:1px solid var(--accent)}
    .g-btn-o{background:var(--bg-t);color:var(--t-s);border:1px solid var(--border)}
    .g-btn:disabled{opacity:0.3;cursor:default}
    .g-score{font-family:var(--font-mono);font-size:0.85rem;color:var(--t-m);margin-left:auto}

    /* Memory */
    .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:500px;margin:16px auto;perspective:800px}
    .mem-card{aspect-ratio:1;border-radius:8px;cursor:pointer;user-select:none;position:relative;min-height:70px}
    .mem-card.matched{cursor:default}

    /* Typing */
    .typ-en{font-size:1.4rem;font-weight:700;color:var(--t-p);text-align:center;margin:20px 0 8px}
    .typ-rom{font-size:0.95rem;color:var(--t-m);text-align:center;margin-bottom:16px}
    .typ-input{width:100%;max-width:340px;padding:12px 16px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg-t);color:var(--t-p);font-size:1.1rem;text-align:center;outline:none;font-family:inherit;display:block;margin:0 auto}
    .typ-input:focus{border-color:var(--t-s)}
    .typ-input:disabled{opacity:0.4}
    .typ-result{text-align:center;font-size:0.9rem;color:var(--t-s);margin-top:12px;min-height:2em}

    /* Hangman */
    .hm-word{text-align:center;font-size:1.8rem;font-family:var(--font-mono);letter-spacing:0.15em;margin:20px 0;color:var(--t-p);min-height:2.5em}
    .hm-hint{text-align:center;font-size:0.85rem;color:var(--t-m);margin-bottom:12px}
    .hm-letters{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:440px;margin:12px auto}
    .hm-letter{width:36px;height:36px;border-radius:4px;border:1px solid var(--border);background:var(--bg-t);color:var(--t-s);font-size:0.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono)}
    .hm-letter.used{opacity:0.2;cursor:default}
    .hm-letter.ok{background:rgba(31,173,105,0.15);border-color:var(--green);color:var(--green)}
    .hm-letter.bad{background:rgba(197,68,42,0.1);border-color:var(--red);color:var(--red)}
    /* Speed Match */
    .sm-q{text-align:center;font-size:1.6rem;font-weight:700;color:var(--accent);margin:12px 0 16px;min-height:2em}
    .sm-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:0 auto}
    .sm-opt{padding:12px 8px;border-radius:6px;border:1.5px solid var(--border);background:var(--bg-t);color:var(--t-p);font-size:0.85rem;cursor:pointer;text-align:center;transition:0.12s;font-family:inherit;font-weight:600}
    .sm-opt:hover{border-color:rgba(var(--accent-rgb),0.4)}
    .sm-opt.correct{background:rgba(31,173,105,0.15);border-color:var(--green);color:var(--green)}
    .sm-opt.wrong{background:rgba(197,68,42,0.1);border-color:var(--red);color:var(--red)}
    .sm-opt:disabled{opacity:0.5;cursor:default}
    .sm-bar{height:6px;background:var(--bg-t);border-radius:3px;overflow:hidden;margin:16px 0}
    .sm-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width 0.3s}
    .sm-streak{text-align:center;font-size:0.85rem;color:var(--t-s);margin-bottom:8px}

    .g-result{text-align:center;padding:20px 0}
    .g-result-score{font-family:var(--font-mono);font-size:2.2rem;font-weight:700;color:var(--accent)}
    .g-result-label{font-size:0.78rem;color:var(--t-m);margin-bottom:16px}
    .g-result-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

    /* ── INSTRUCTIONS MODAL ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);z-index:999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:modalFadeIn 0.2s ease}
    @keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
    .modal-box{background:var(--bg-secondary);border:1px solid rgba(var(--accent-rgb),0.25);border-radius:16px;padding:0;max-width:420px;width:90%;text-align:center;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:modalSlideIn 0.25s ease}
    @keyframes modalSlideIn{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
    .modal-header{background:var(--bg-primary);padding:28px 28px 18px;border-bottom:1px solid var(--border-default)}
    .modal-icon{font-size:2.2rem;margin-bottom:6px}
    .modal-title{font-family:var(--font-mono);font-size:1.1rem;font-weight:700;color:var(--accent);letter-spacing:0.02em}
    .modal-body{padding:20px 28px}
    .modal-body ul{list-style:none;padding:0;margin:0}
    .modal-body li{font-size:0.82rem;color:var(--text-secondary);line-height:1.5;padding:5px 0 5px 24px;position:relative;text-align:left;border-bottom:1px solid rgba(255,255,255,0.04)}
    .modal-body li:last-child{border-bottom:none}
    .modal-body li::before{content:'\25B8';position:absolute;left:0;color:var(--accent);font-size:0.7rem}
    .modal-footer{background:var(--bg-primary);padding:16px 28px;border-top:1px solid var(--border-default)}
    .modal-btn{display:block;width:100%;padding:12px 0;border-radius:8px;font-size:0.95rem;font-weight:700;cursor:pointer;font-family:inherit;border:none;background:var(--accent);color:#0a0a23;transition:background 0.15s,transform 0.1s}
    .modal-btn:hover{background:#f5cb5c;transform:translateY(-1px)}
    .modal-btn:active{transform:translateY(0)}

    /* ── MEMORY IMPROVEMENTS ── */
    .mem-card-inner{width:100%;height:100%;transition:transform 0.4s;transform-style:preserve-3d;position:relative;border-radius:6px}
    .mem-card.flipped .mem-card-inner{transform:rotateY(180deg)}
    .mem-card-face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;border-radius:6px;backface-visibility:hidden;font-size:0.85rem;font-weight:600}
    .mem-card-front{background:var(--bg-t);color:transparent;border:2px solid var(--border)}
    .mem-card-front::after{content:'?';color:var(--t-m);font-size:1.3rem;font-weight:700}
    .mem-card-back{background:var(--bg-p);color:var(--t-p);border:2px solid rgba(var(--accent-rgb),0.3);transform:rotateY(180deg);flex-direction:column;gap:2px}
    .mem-card-back .rom{font-size:0.65rem;color:var(--t-m);font-weight:400}
    .mem-card.matched .mem-card-inner .mem-card-back{background:rgba(31,173,105,0.15);border-color:var(--green);color:var(--green)}
    .mem-card.matched .mem-card-inner .mem-card-back .rom{color:var(--green)}

    /* ── TYPING IMPROVEMENTS ── */
    .ty-bar-wrap{display:flex;gap:6px;align-items:center;margin-bottom:4px}
    .ty-bar{flex:1;height:8px;background:var(--bg-t);border-radius:4px;overflow:hidden}
    .ty-bar-fill{height:100%;border-radius:4px;transition:width 0.3s,background 0.5s}
    .ty-word-num{font-size:0.72rem;color:var(--t-m);font-family:var(--font-mono);text-align:center;margin-bottom:4px}
    .ty-feedback{text-align:center;font-size:0.9rem;min-height:2em;margin-top:8px;transition:opacity 0.15s}
    .ty-feedback.ok{color:var(--green)}
    .ty-feedback.bad{color:var(--red)}

    /* ── HANGMAN IMPROVEMENTS ── */
    .hm-gallows-area{font-family:var(--font-mono);font-size:0.7rem;color:var(--t-m);text-align:center;line-height:1.25;margin:8px 0;white-space:pre;min-height:100px}
    .hm-wrong-letters{text-align:center;font-size:0.78rem;color:var(--red);margin-bottom:8px;min-height:1.5em}
    .hm-kana-row{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:4px}
    .hm-kana-row-label{width:100%;font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--t-m);margin-bottom:2px;text-align:center}

    /* ── SPEED MATCH IMPROVEMENTS ── */
    .sm-streak-display{text-align:center;margin-bottom:8px}
    .sm-streak-fire{font-size:1.1rem}
    .sm-streak-num{font-family:var(--font-mono);font-size:0.85rem;color:var(--t-m);margin-left:4px}

    @media(max-width:500px){.main{padding:76px 12px 60px}.gh-title{font-size:1.3rem;margin-top:20px}.mem-card{min-height:54px}.mem-card-face{font-size:0.72rem}.mem-card-front::after{font-size:1rem}.hm-word{font-size:1.3rem}.sm-q{font-size:1.2rem}.hm-letter{width:30px;height:30px;font-size:0.75rem}}
    @media(max-height:500px) and (orientation:landscape){.mem-card{min-height:50px}}

    .logo-small { display: none; }

    @media (max-width: 640px) {
      .nav-inner { padding: 0 16px; }
      .logo-large { display: none !important; }
      .logo-small { display: block !important; }
      .nav-search input { display: none; }
      .nav-search { padding: 6px 10px; }
    }

    [data-theme="light"] .nav { background: #0a0a23 !important; }
    [data-theme="light"] .nav * { color: #ffffff !important; border-color: transparent !important; }
    [data-theme="light"] .nav-dropdown { background: #1b1b32 !important; border-color: #3b3b5c !important; }
    [data-theme="light"] .nav-dropdown a:hover,
    [data-theme="light"] .nav-dropdown button:hover { background: rgba(255,255,255,0.08) !important; }
  </style>
  <link rel="stylesheet" href="assets/nav.css"/>
  <script src="assets/nav-template.js"></script>
</head>

// ── HELPERS ──────────────────────────────────────────────────────────────────────
var _gameState = null;
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.random()*i|0;var t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(arr,n){return shuffle([...arr]).slice(0,n)}
function qs(s,ctx){return(ctx||document).querySelector(s)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}

// ── RENDER ────────────────────────────────────────────────────────────────────────
function showHub(){
  document.getElementById('main-content').innerHTML=
    '<div class="gh-title">&#x1F3AE; Language Games</div>'+
    '<div class="gh-sub">Practice Japanese hospitality vocabulary through fun challenges</div>'+
    '<div class="gh-grid">'+
      '<div class="gh-card" onclick="showGame(\'memory\')"><div class="gh-icon">&#x1F0CF;</div><div class="gh-name">Memory Match</div><div class="gh-desc">Flip cards to match Japanese words with English meanings</div></div>'+
      '<div class="gh-card" onclick="showGame(\'typing\')"><div class="gh-icon">&#x2328;&#xFE0F;</div><div class="gh-name">Typing Challenge</div><div class="gh-desc">Type Japanese words as fast as you can — 60 seconds</div></div>'+
      '<div class="gh-card" onclick="showGame(\'hangman\')"><div class="gh-icon">&#x1F3AD;</div><div class="gh-name">Hangman</div><div class="gh-desc">Guess the hospitality word one letter at a time</div></div>'+
      '<div class="gh-card" onclick="showGame(\'speedmatch\')"><div class="gh-icon">&#x26A1;</div><div class="gh-name">Speed Match</div><div class="gh-desc">Match words to meanings before time runs out</div></div>'+
    '</div>';
}
function showGame(type){
  if(type==='memory'){_gameState={};GameMemory.init()}
  else if(type==='typing'){_gameState={};GameTyping.init()}
  else if(type==='hangman'){_gameState={};GameHangman.init()}
  else if(type==='speedmatch'){_gameState={};GameSpeedMatch.init()}
}

// ── INSTRUCTIONS MODAL ────────────────────────────────────────────────────────────
function showInstructions(title,icon,lines,callback){
  var html='<div class="modal-overlay" id="instr-modal"><div class="modal-box"><div class="modal-header"><div class="modal-icon">'+icon+'</div><div class="modal-title">'+title+'</div></div><div class="modal-body"><ul>'+lines.map(function(l){return '<li>'+l+'</li>'}).join('')+'</ul></div><div class="modal-footer"><button class="modal-btn" id="instr-start-btn">Start Game</button></div></div></div>';
  var div=document.createElement('div');div.id='instr-place';div.innerHTML=html;
  document.body.appendChild(div);
  document.getElementById('instr-start-btn').onclick=function(){
    closeInstructions();
    callback();
  };
  document.getElementById('instr-modal').onclick=function(e){
    if(e.target===this){closeInstructions()}
  };
}
function closeInstructions(){
  var el=document.getElementById('instr-place');
  if(el)el.remove();
}

// ── GAME: MEMORY ──────────────────────────────────────────────────────────────────
var GameMemory={
  init:function(){
    showInstructions('Memory Match','&#x1F0CF;',[
      'Flip two cards to find Japanese-English matching pairs',
      'Match all 8 pairs to complete the game',
      'Fewer moves and less time = higher score'
    ],function(){GameMemory._start()});
  },
  _start:function(){
    var items=pick(GAMES_VOCAB,8);
    var cards=[];
    items.forEach(function(v,i){
      cards.push({id:i,type:'jp',pair:i});
      cards.push({id:i,type:'en',pair:i});
    });
    cards.forEach(function(c,i){
      var w=items[c.pair];
      c.jp=w.jp; c.en=w.en; c.rom=w.rom;
    });
    shuffle(cards);
    _gameState={cards:cards,flipped:[],matched:{},moves:0,start:Date.now(),done:false};
    this.render();
  },
  render:function(){
    var s=_gameState;
    var elapsed=Math.floor((Date.now()-s.start)/1000);
    var m=Math.floor(elapsed/60),sec=elapsed%60;
    var matchedCount=Object.keys(s.matched).length;
    var total=s.cards.length/2;
    var html='<button class="gh-back" onclick="showHub()">&#x2190; Back to Games</button><div class="g-title">&#x1F0CF; Memory Match</div><div class="g-area"><div class="g-row"><span class="g-label">Moves: <strong>'+s.moves+'</strong></span><span class="g-label">Pairs: <strong>'+matchedCount+'/'+total+'</strong></span><span class="g-label">Time: <strong>'+(m>0?m+':':'')+(sec<10?'0':'')+sec+'</strong></span></div><div class="mem-grid">';
    s.cards.forEach(function(c,i){
      var flipped=s.flipped.indexOf(i)>=0||s.matched[c.pair];
      var matched=s.matched[c.pair];
      var face=matched||flipped?(c.type==='jp'?esc(c.jp):esc(c.en)):'';
      var rom=matched||flipped?(c.type==='jp'?esc(c.rom):''):'';
      html+='<div class="mem-card'+(flipped?' flipped':'')+(matched?' matched':'')+'" onclick="GameMemory.flip('+i+')"><div class="mem-card-inner"><div class="mem-card-face mem-card-front"></div><div class="mem-card-face mem-card-back">'+(face?face:'')+(rom?'<span class="rom">'+rom+'</span>':'')+'</div></div></div>';
    });
    html+='</div>';
    if(matchedCount===total&&!s.done){s.done=true;
      html+='<div class="g-result"><div class="g-result-score">'+(m>0?m+':':'')+(sec<10?'0':'')+sec+'</div><div class="g-result-label">Completed in '+s.moves+' moves</div><div class="g-result-btns"><button class="g-btn g-btn-y" onclick="GameMemory._start()">Play Again</button><button class="g-btn g-btn-o" onclick="showHub()">Back to Games</button></div></div>';
    }
    html+='</div>';
    document.getElementById('main-content').innerHTML=html;
    if(matchedCount<total){setTimeout(GameMemory.tick,500)}
  },
  tick:function(){if(_gameState&&!_gameState.done)GameMemory.render()},
  flip:function(i){
    var s=_gameState;
    if(s.done)return;
    if(s.flipped.indexOf(i)>=0||s.matched[s.cards[i].pair])return;
    if(s.flipped.length>=2)return;
    s.flipped.push(i);s.moves++;
    if(s.flipped.length===2){
      var a=s.cards[s.flipped[0]],b=s.cards[s.flipped[1]];
      if(a.pair===b.pair&&a.id!==b.id){s.matched[a.pair]=true;s.flipped=[];this.render();return}
      var that=this;
      setTimeout(function(){s.flipped=[];that.render()},800);
    }
    this.render();
  }
};

// ── GAME: TYPING CHALLENGE ────────────────────────────────────────────────────────
var GameTyping={
  init:function(){
    showInstructions('Typing Challenge','&#x2328;&#xFE0F;',[
      'Type the Japanese word that matches the English prompt',
      'Use your IME to type in Japanese (hiragana/katakana)',
      'Press Enter to submit each answer',
      'You have 60 seconds — answer as many as you can!'
    ],function(){GameTyping._start()});
  },
  _start:function(){
    _gameState={words:shuffle([...GAMES_VOCAB]),index:0,score:0,total:0,time:60,start:null,timer:null,ended:false};
    this.render();
  },
  barColor:function(pct){
    if(pct>50)return 'var(--green)';
    if(pct>25)return 'var(--accent)';
    return 'var(--red)';
  },
  render:function(){
    var s=_gameState;
    var html='<button class="gh-back" onclick="GameTyping.cleanup();showHub()">&#x2190; Back to Games</button><div class="g-title">&#x2328;&#xFE0F; Typing Challenge</div><div class="g-area">';
    if(s.ended){
      var pct=Math.round(s.score/Math.max(s.total,1)*100);
      html+='<div class="g-result"><div class="g-result-score">'+s.score+'</div><div class="g-result-label">Correct out of '+s.total+' ('+pct+'%)</div><div class="g-result-btns"><button class="g-btn g-btn-y" onclick="GameTyping._start()">Play Again</button><button class="g-btn g-btn-o" onclick="showHub()">Back to Games</button></div></div>';
    }else{
      var w=s.words[s.index];
      var barPct=s.time/60*100;
      var barBg=this.barColor(barPct);
      html+='<div class="g-row"><span class="g-label">Score: <strong>'+s.score+'</strong></span><span class="g-label">Time: <strong id="ty-time">'+s.time+'s</strong></span></div>';
      html+='<div class="ty-bar-wrap"><div class="ty-bar"><div class="ty-bar-fill" id="ty-bar" style="width:'+barPct+'%;background:'+barBg+'"></div></div></div>';
      html+='<div class="ty-word-num">Word '+(s.index+1)+' of 80</div>';
      html+='<div class="typ-en">'+esc(w.en)+'</div><div class="typ-rom">'+esc(w.rom)+'</div>';
      html+='<input class="typ-input" id="ty-input" type="text" placeholder="Type in Japanese…" autocomplete="off" onkeydown="GameTyping.check(event)"/>';
      html+='<div class="ty-feedback" id="ty-feedback"></div>';
    }
    html+='</div>';
    document.getElementById('main-content').innerHTML=html;
    if(!s.ended){var inp=document.getElementById('ty-input');if(inp)setTimeout(function(){inp.focus()},50)}
  },
  check:function(e){
    if(e.key!=='Enter')return;
    var s=_gameState;if(s.ended)return;
    if(!s.start){s.start=Date.now();GameTyping.startTimer()}
    var inp=document.getElementById('ty-input');
    var val=inp.value.trim();if(!val)return;
    var w=s.words[s.index];
    s.total++;
    var fb=document.getElementById('ty-feedback');
    var ok=val===w.jp||val.toLowerCase()===w.jp.toLowerCase();
    if(ok){s.score++;fb.innerHTML='&#x2705; Correct!';fb.className='ty-feedback ok';inp.value='';s.index=(s.index+1)%s.words.length;var that=this;setTimeout(function(){that.render()},300)}
    else{fb.innerHTML='&#x274C; Expected: <strong>'+esc(w.jp)+'</strong>';fb.className='ty-feedback bad';inp.value='';s.index=(s.index+1)%s.words.length;var that=this;setTimeout(function(){that.render()},800)}
  },
  startTimer:function(){
    var s=_gameState;
    s.timer=setInterval(function(){
      s.time--;var bar=document.getElementById('ty-bar'),tm=document.getElementById('ty-time');
      if(bar){var pct=s.time/60*100;bar.style.width=pct+'%';bar.style.background=GameTyping.barColor(pct)}
      if(tm)tm.textContent=s.time+'s';
      if(s.time<=0){clearInterval(s.timer);s.ended=true;GameTyping.render()}
    },1000);
  },
  cleanup:function(){var s=_gameState;if(s&&s.timer){clearInterval(s.timer);s.timer=null}}
};

// ── GAME: HANGMAN ─────────────────────────────────────────────────────────────────
var GameHangman={
  init:function(){
    showInstructions('Hangman','&#x1F3AD;',[
      'Guess the Japanese hospitality word one letter at a time',
      'Click kana characters to fill in the blanks',
      'Each wrong guess adds a body part to the gallows',
      '6 wrong guesses and you lose — solve it before then!'
    ],function(){GameHangman._start()});
  },
  _start:function(){
    var words=pick(GAMES_VOCAB,10);
    _gameState={words:words,index:0,wrong:0,maxWrong:6,guessed:[],done:false};
    this.render();
  },
  render:function(){
    var s=_gameState;
    if(s.index>=s.words.length){this.showResult();return}
    var w=s.words[s.index];
    var display=w.jp.split('').map(function(c){return s.guessed.indexOf(c)>=0?c:'_'}).join(' ');
    var won=display.indexOf('_')<0;
    var lost=s.wrong>=s.maxWrong;
    var kanaRows={
      'A':'あいうえおアイウエオ','K':'かきくけこカキクケコ',
      'S':'さしすせそサシスセソ','T':'たちつてとタチツテト',
      'N':'なにぬねのナニヌネノ','H':'はひふへほハヒフヘホ',
      'M':'まみむめもマミムメモ','Y':'やゆよヤユヨ',
      'R':'らりるれろラリルレロ','W':'わをんワヲン',
      'G':'がぎぐげごガギグゲゴ','Z':'ざじずぜぞザジズゼゾ',
      'D':'だぢづでどダヂヅデド','B':'ばびぶべぼバビブベボ',
      'P':'ぱぴぷぺぽパピプペポ'
    };
    var html='<button class="gh-back" onclick="showHub()">&#x2190; Back to Games</button><div class="g-title">&#x1F3AD; Hangman</div><div class="g-area">';
    html+='<div class="g-row"><span class="g-label">Word <strong>'+(s.index+1)+'/'+s.words.length+'</strong></span><span class="g-label">Mistakes <strong>'+s.wrong+'/'+s.maxWrong+'</strong></span></div>';
    html+='<div class="hm-gallows-area">'+this.gallows(s.wrong)+'</div><div class="hm-word">'+(won||lost?esc(w.jp):display)+'</div>';
    html+='<div class="hm-hint">'+(won?'Correct! <strong>'+esc(w.jp)+'</strong> = '+esc(w.en):lost?'The word was <strong>'+esc(w.jp)+'</strong> = '+esc(w.en):'English: '+esc(w.en))+'</div>';
    var wrongLetters=s.guessed.filter(function(l){return w.jp.indexOf(l)<0});
    if(wrongLetters.length>0){
      html+='<div class="hm-wrong-letters">Wrong: '+wrongLetters.join(' ')+'</div>';
    }
    if(!won&&!lost){
      html+='<div class="hm-letters">';
      var rowNames=Object.keys(kanaRows);
      rowNames.forEach(function(rn){
        var chars=kanaRows[rn].split('');
        var hasActive=chars.some(function(c){return s.guessed.indexOf(c)<0});
        if(!hasActive)return;
        html+='<div class="hm-kana-row"><div class="hm-kana-row-label">'+rn+'</div>';
        chars.forEach(function(l){
          var used=s.guessed.indexOf(l)>=0;
          var ok=used&&w.jp.indexOf(l)>=0;
          var bad=used&&w.jp.indexOf(l)<0;
          html+='<div class="hm-letter'+(used?' used':'')+(ok?' ok':'')+(bad?' bad':'')+'" onclick="GameHangman.guess(\''+l+'\')">'+l+'</div>';
        });
        html+='</div>';
      });
      html+='</div>';
    }else{
      html+='<div class="g-result-btns" style="margin-top:16px">';
      if(won){html+='<button class="g-btn g-btn-p" onclick="GameHangman.next()">Next Word</button>'}
      else{html+='<button class="g-btn g-btn-y" onclick="GameHangman.next()">Next Word</button>'}
      html+='<button class="g-btn g-btn-o" onclick="showHub()">Quit</button></div>';
    }
    html+='</div>';
    document.getElementById('main-content').innerHTML=html;
  },
  gallows:function(n){
    var stages=[
      '\n\n\n\n\n\n\n________',      '\n|\n|\n|\n|\n|\n|________',
      '____\n|  |\n|\n|\n|\n|\n|________','____\n|  |\n|  O\n|\n|\n|\n|________',
      '____\n|  |\n|  O\n|  |\n|\n|\n|________','____\n|  |\n|  O\n| /|\\\n|\n|\n|________',
      '____\n|  |\n|  O\n| /|\\\n| / \\\n|\n|________'
    ];
    return stages[Math.min(n,6)];
  },
  guess:function(letter){
    var s=_gameState;if(s.done)return;
    if(s.guessed.indexOf(letter)>=0)return;
    var w=s.words[s.index];
    s.guessed.push(letter);
    if(w.jp.indexOf(letter)<0)s.wrong++;
    this.render();
  },
  next:function(){
    var s=_gameState;s.index++;s.wrong=0;s.guessed=[];
    if(s.index>=s.words.length)this.showResult();else this.render();
  },
  showResult:function(){
    var html='<button class="gh-back" onclick="showHub()">&#x2190; Back to Games</button><div class="g-title">&#x1F3AD; Hangman</div><div class="g-area"><div class="g-result"><div class="g-result-score">Complete!</div><div class="g-result-label">You finished all words</div><div class="g-result-btns"><button class="g-btn g-btn-y" onclick="GameHangman._start()">Play Again</button><button class="g-btn g-btn-o" onclick="showHub()">Back to Games</button></div></div></div>';
    document.getElementById('main-content').innerHTML=html;
  }
};

// ── GAME: SPEED MATCH ─────────────────────────────────────────────────────────────
var GameSpeedMatch={
  init:function(){
    showInstructions('Speed Match','&#x26A1;',[
      'Read the Japanese word and pick the correct English meaning',
      'Answer as many as you can in 45 seconds',
      'Correct answers in a row build your streak',
      'Wrong answers reset your streak to zero'
    ],function(){GameSpeedMatch._start()});
  },
  _start:function(){
    _gameState={words:shuffle([...GAMES_VOCAB]),index:0,score:0,total:0,time:45,timer:null,ended:false,streak:0,bestStreak:0,start:null};
    this.render();
  },
  barColor:function(pct){
    if(pct>50)return 'var(--accent)';
    if(pct>25)return 'var(--accent-yellow)';
    return 'var(--red)';
  },
  render:function(){
    var s=_gameState;
    var html='<button class="gh-back" onclick="GameSpeedMatch.cleanup();showHub()">&#x2190; Back to Games</button><div class="g-title">&#x26A1; Speed Match</div><div class="g-area">';
    if(s.ended){
      html+='<div class="g-result"><div class="g-result-score">'+s.score+'</div><div class="g-result-label">Correct out of '+s.total+' | Best streak: '+s.bestStreak+'</div><div class="g-result-btns"><button class="g-btn g-btn-y" onclick="GameSpeedMatch._start()">Play Again</button><button class="g-btn g-btn-o" onclick="showHub()">Back to Games</button></div></div>';
    }else{
      var barPct=s.time/45*100;
      var barBg=this.barColor(barPct);
      html+='<div class="g-row"><span class="g-label">Score: <strong>'+s.score+'</strong></span><span class="g-label">Time: <strong id="sm-time">'+s.time+'s</strong></span></div>';
      html+='<div class="sm-bar"><div class="sm-bar-fill" id="sm-bar" style="width:'+barPct+'%;background:'+barBg+'"></div></div>';
      var fire=s.streak>=3?'🔥'.repeat(Math.min(s.streak,5)):'';
      html+='<div class="sm-streak-display"><span class="sm-streak-num">Streak: '+s.streak+'</span>'+(fire?' <span class="sm-streak-fire">'+fire+'</span>':'')+'</div>';
      if(s.index<s.words.length){
        var w=s.words[s.index];
        html+='<div class="sm-q">'+esc(w.jp)+'</div>';
        var opts=this.buildOpts(w);
        html+='<div class="sm-opts" id="sm-opts">';
        opts.forEach(function(o,i){html+='<button class="sm-opt" onclick="GameSpeedMatch.pick('+i+')">'+esc(o)+'</button>'});
        html+='</div>';
      }
    }
    html+='</div>';
    document.getElementById('main-content').innerHTML=html;
    if(!s.ended&&!s.start){s.start=Date.now();this.startTimer()}
  },
  buildOpts:function(w){
    var opts=[w.en];
    var others=GAMES_VOCAB.filter(function(v){return v.en!==w.en});
    shuffle(others);
    for(var i=0;i<3&&i<others.length;i++)opts.push(others[i].en);
    return shuffle(opts);
  },
  pick:function(idx){
    var s=_gameState;if(s.ended)return;
    var btns=document.getElementById('sm-opts').querySelectorAll('.sm-opt');
    btns.forEach(function(b){b.disabled=true});
    var w=s.words[s.index];
    var opts=GAMES_VOCAB.filter(function(v){return v.en!==w.en});
    var allOpts=[w.en];for(var i=0;i<3&&i<opts.length;i++)allOpts.push(opts[i].en);
    shuffle(allOpts);
    var correctIdx=allOpts.indexOf(w.en);
    var pickText=btns[idx].textContent;
    s.total++;
    if(pickText===w.en){s.score++;s.streak++;if(s.streak>s.bestStreak)s.bestStreak=s.streak;btns[idx].classList.add('correct')}
    else{s.streak=0;btns[idx].classList.add('wrong');btns[correctIdx].classList.add('correct')}
    s.index++;
    var that=this;
    setTimeout(function(){that.render()},500);
  },
  startTimer:function(){
    var s=_gameState;
    s.timer=setInterval(function(){
      s.time--;var bar=document.getElementById('sm-bar'),tm=document.getElementById('sm-time');
      if(bar){var pct=s.time/45*100;bar.style.width=pct+'%';bar.style.background=GameSpeedMatch.barColor(pct)}
      if(tm)tm.textContent=s.time+'s';
      if(s.time<=0){clearInterval(s.timer);s.ended=true;GameSpeedMatch.render()}
    },1000);
  },
  cleanup:function(){var s=_gameState;if(s&&s.timer){clearInterval(s.timer);s.timer=null}}
};
