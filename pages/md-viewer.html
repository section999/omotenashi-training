  <style>
    [data-theme="light"] .msg-bubble { color: #3b3b4f !important; }
    [data-theme="light"] .msg-label { color: #3b3b4f !important; }
    [data-theme="light"] .chat-header-title { color: #3b3b4f !important; }
    [data-theme="light"] .chat-turn-progress { color: #78788a !important; }
    [data-theme="light"] .choice-btn { color: #3b3b4f; }
    [data-theme="light"] .choice-btn:hover { color: #1b1b32; }
    [data-theme="light"] .modal { background: #ffffff !important; border-color: #c8c9cc !important; }
    [data-theme="light"] .modal-bar { background: #f5f6f7 !important; border-color: #c8c9cc !important; }
    [data-theme="light"] .modal-bar-title { color: #1b1b32 !important; }

    [data-theme="light"] .modal-btn-next:hover { background: #d8d8e0 !important; }
    [data-theme="light"] #jp-toast { background: #ffffff; border-color: #c8c9cc; color: #1b1b32; }
    [data-theme="light"] .section-body p,
    [data-theme="light"] .section-body li,
    [data-theme="light"] .section-body strong,
    [data-theme="light"] .section-body em,
    [data-theme="light"] .section-body ul,
    [data-theme="light"] .section-body ol,
    [data-theme="light"] .section-body th,
    [data-theme="light"] .section-body td { color: #1b1b32; }
    [data-theme="light"] .section-body th { background: rgba(0,0,0,0.04); border-right-color: rgba(0,0,0,0.1); }
    [data-theme="light"] .section-body td { border-bottom-color: rgba(0,0,0,0.08); border-right-color: rgba(0,0,0,0.08); }
    [data-theme="light"] .quiz-label,
    [data-theme="light"] .quiz-q { color: #1b1b32; }
    [data-theme="light"] .quiz-opt,
    [data-theme="light"] .tf-btn { color: #3b3b4f; }
    [data-theme="light"] .quiz-opt:hover { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.2); }
    [data-theme="light"] .tf-btn:hover { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.2); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 18px; }
    body { background: var(--bg-secondary); color: var(--text-primary); font-family: var(--font-sans); min-height: 100vh; }

    /* NAV */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; height: 60px; background: #0a0a23; backdrop-filter: blur(16px); }
    .nav-inner { max-width: 100%; padding: 0 32px; height: 100%; display: flex; align-items: center; justify-content: space-between; position: relative; }
    .logo-small { display: none; }
    @media (max-width: 640px) {
      .nav-inner { padding: 0 16px; }
      .logo-large { display: none !important; }
      .logo-small { display: block !important; }
    }
    .tts-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--bg-tertiary); border: 1px solid var(--border-default); color: var(--text-secondary); font-size: 0.85rem; padding: 10px 20px; border-radius: 8px; z-index: 9999; pointer-events: none; opacity: 0; transition: opacity 0.2s; }
    .tts-toast.show { opacity: 1; }

    /* LAYOUT */
    .layout { display: flex; margin-top: 60px; min-height: calc(100vh - 60px); }

    /* MAIN */
    .main { flex: 1; margin-left: auto; margin-right: auto; padding: 48px 40px 80px; max-width: 860px; }

    /* BREADCRUMB */
    .breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 32px; flex-wrap: wrap; }
    .breadcrumb a { color: var(--text-muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--text-secondary); }
    .breadcrumb span { color: var(--border-default); }

    /* SECTION */
    .lesson-section { margin-bottom: 48px; }
    .section-heading {
      font-family: var(--font-mono); font-size: 1.65rem; font-weight: 700;
      color: var(--accent-yellow); border-left: 3px solid var(--accent-yellow);
      padding-left: 12px; margin-bottom: 20px; line-height: 1.3;
    }
    .section-body { line-height: 1.75; }
    .section-body p { font-size: 1rem; color: #fff; line-height: 1.75; margin-bottom: 0.9rem; }
    .section-body h1, .section-body h2 { font-size: 1.2rem; font-weight: 700; color: var(--accent-yellow); margin: 1.4rem 0 0.6rem; }
    .section-body h3 { font-size: 1rem; font-weight: 600; color: var(--text-secondary); margin: 1rem 0 0.4rem; }
    .section-body strong { color: #fff; font-weight: 700; }
    .section-body em { color: #fff; font-style: italic; }
    .section-body ul, .section-body ol { margin: 0.5rem 0 1rem 1.4rem; color: #fff; }
    .section-body li { margin-bottom: 0.4rem; line-height: 1.65; font-size: 1rem; color: #fff; }
    .section-body hr { border: none; border-top: 1px solid var(--border-default); margin: 28px 0; }
    .section-body table { display: table; width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 1rem; table-layout: fixed; }
    .section-body th { background: rgba(255,255,255,0.04); text-align: center; padding: 8px 14px; color: #fff; font-weight: 600; border-bottom: 1px solid var(--border-default); border-right: 1px solid var(--border-default); white-space: nowrap; }
    .section-body th:last-child { border-right: none; }
    .section-body td { padding: 8px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.06); color: #fff; text-align: left; }
    .section-body td:last-child { border-right: none; }
    @media (max-width: 640px) {
      .section-body table { font-size: 0.875rem; display: block; overflow-x: auto; }
      .section-body th { padding: 6px 10px; white-space: normal; }
      .section-body td { padding: 6px 10px; }
    }
    @media (max-width: 480px) {
      .keigo-pair { flex-direction: column; }
    }
    .section-body blockquote { border-left: 3px solid var(--accent-blue); padding-left: 16px; color: var(--text-secondary); margin: 1rem 0; font-style: italic; }
    .jp-speak { text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; cursor: pointer; transition: color 0.12s; }
    .jp-speak:hover { color: var(--accent-yellow); }
    [data-theme="light"] .jp-speak:hover { color: var(--accent-blue); }

    /* QUIZ */
    .section-quiz { margin-top: 56px; background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: 8px; padding: 20px 24px; }
    .quiz-label { font-family: var(--font-mono); font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; margin-bottom: 10px; text-align: center; }
    .quiz-q { font-size: 1rem; font-weight: 600; margin-bottom: 14px; line-height: 1.5; color: #fff; white-space: pre-line; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-radius: 5px; border: 1px solid var(--border-default); cursor: pointer; font-size: 1rem; color: #fff; transition: background 0.12s, border-color 0.12s; }
    .quiz-opt:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.2); }
    .quiz-opt.selected { border-color: var(--accent-blue); background: rgba(241,190,50,0.08); }
    .quiz-opt.correct { border-color: var(--accent-green); color: var(--accent-green); background: rgba(31,173,105,0.08); }
    .quiz-opt.wrong { border-color: var(--accent-red); color: var(--accent-red); background: rgba(197,68,42,0.08); }
    .quiz-opt-letter { width: 22px; height: 22px; border-radius: 50%; border: 1px solid currentColor; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.7rem; flex-shrink: 0; }
    .tf-options { display: flex; gap: 10px; margin-bottom: 12px; }
    .tf-btn { padding: 8px 24px; border-radius: 5px; border: 1px solid var(--border-default); background: transparent; color: #fff; font-size: 1rem; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .tf-btn:hover { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.2); }
    .tf-btn.correct { border-color: var(--accent-green); background: rgba(31,173,105,0.08); color: var(--accent-green); }
    .tf-btn.wrong { border-color: var(--accent-red); background: rgba(197,68,42,0.08); color: var(--accent-red); }
    .fitb-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border-default); border-radius: 5px; padding: 10px 14px; color: var(--text-primary); font-size: 0.875rem; font-family: inherit; margin-bottom: 10px; }
    .fitb-input:focus { outline: none; border-color: var(--accent-blue); }
    .fitb-input:disabled { opacity: 0.6; }
    .short-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid var(--border-default); border-radius: 5px; padding: 10px 14px; color: var(--text-primary); font-size: 0.875rem; font-family: inherit; resize: vertical; min-height: 70px; margin-bottom: 10px; }
    .short-input:focus { outline: none; border-color: var(--accent-blue); }
    .model-answer { display: none; margin-top: 10px; padding: 12px 14px; border-radius: 5px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-default); font-size: 0.875rem; color: var(--text-secondary); line-height: 1.6; }
    .model-answer strong { color: var(--accent-green); display: block; margin-bottom: 4px; }
    .quiz-check { display: block; margin: 12px auto 0; padding: 9px 20px; background: var(--accent-green); color: var(--text-inverse); border: none; border-radius: 5px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: opacity 0.15s; }
    .quiz-check:hover { opacity: 0.85; }
    .quiz-check:disabled { opacity: 0.4; cursor: default; }
    .quiz-feedback { margin-top: 12px; padding: 10px 14px; border-radius: 5px; font-size: 0.85rem; line-height: 1.5; display: none; }
    .quiz-feedback.ok { background: rgba(31,173,105,0.12); border: 1px solid rgba(31,173,105,0.3); color: var(--accent-green); }
    .quiz-feedback.err { background: rgba(197,68,42,0.12); border: 1px solid rgba(197,68,42,0.3); color: #e07060; }

    /* MATCHING QUIZ */
    .match-pairs { display: flex; flex-direction: column; gap: 8px; }
    .match-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 5px; border: 1px solid var(--border-default); }
    .match-left { flex: 1; font-size: 1rem; color: var(--text-primary); }
    .match-arrow { color: var(--text-muted); font-size: 0.875rem; }
    .match-select { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border-default); background: var(--bg-tertiary); color: var(--text-primary); font-size: 0.875rem; cursor: pointer; min-width: 120px; font-family: inherit; }
    .match-select.correct { border-color: var(--accent-green); background: rgba(31,173,105,0.1); }
    .match-select.wrong { border-color: var(--accent-red); background: rgba(197,68,42,0.1); }

    /* ORDERING QUIZ */
    .order-list { display: flex; flex-direction: column; gap: 6px; }
    .order-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 5px; border: 1px solid var(--border-default); transition: border-color 0.2s, background 0.2s; }
    .order-item:hover { background: rgba(255,255,255,0.03); }
    .order-grip { color: var(--text-muted); cursor: grab; font-size: 1rem; user-select: none; }
    .order-num { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0; }
    .order-text { flex: 1; font-size: 1rem; color: var(--text-primary); }
    .order-btns { display: flex; gap: 4px; }
    .order-btn { background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: 3px; padding: 2px 6px; cursor: pointer; color: var(--text-secondary); font-size: 0.7rem; line-height: 1; }
    .order-btn:hover { background: rgba(241,190,50,0.12); border-color: var(--accent-yellow); color: var(--accent-yellow); }

    /* VOCAB EXAMPLE (v01–v11 format) */
    .vocab-example-line { border-left: 3px solid #f1be32; padding-left: 12px; margin: 1rem 0; font-style: normal; }
    .vocab-example-label { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: #f1be32; display: block; margin-bottom: 2px; font-style: normal; }

    /* STEP INDICATOR */
    /* LESSON NAV */
    .lesson-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border-default); }
    .lesson-nav-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border: 1px solid var(--border-default); border-radius: 5px; color: var(--text-secondary); text-decoration: none; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; transition: border-color 0.12s, color 0.12s, background 0.12s; background: transparent; }
    .lesson-nav-btn:hover { border-color: var(--accent-yellow); color: var(--accent-yellow); background: rgba(241,190,50,0.04); }
    .lesson-nav-placeholder { padding: 9px 18px; visibility: hidden; pointer-events: none; }
    .step-indicator { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); text-align: center; flex: 1; min-width: 0; }

    /* KEYBOARD NAV HINT */
    .keynav-hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    .keynav-hint.visible { opacity: 1; }
    .keynav-key { background: var(--bg-secondary); border: 1px solid var(--border-default); border-radius: 4px; padding: 3px 8px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-secondary); }

    /* SIMULATOR */
    .chat-area { display: flex; flex-direction: column; background: var(--bg-primary); border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; }
    .chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border-default); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .chat-header-title { font-weight: 700; font-size: 1.2rem; color: #fff; }
    .chat-turn-progress { position:absolute; right:20px; top:50%; transform:translateY(-50%); font-size:0.7rem; color:rgba(255,255,255,0.35); letter-spacing:0.04em; }
    .msg-system { display: flex; align-items: center; gap: 10px; font-size: 0.78rem; color: var(--text-muted); margin: 8px 16px; font-style: italic; }
    .msg-system::before, .msg-system::after { content: ''; flex: 1; height: 1px; background: var(--border-default); }
    .chat-messages { padding: 24px; display: flex; flex-direction: column; gap: 18px; min-height: 300px; max-height: 480px; overflow-y: auto; }
    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg-user { justify-content: flex-end; }
    .msg-guest > div, .msg-user > div { max-width: 50%; }
    .msg-bubble { max-width: 100%; width: 100%; padding: 14px 18px; border-radius: 8px; font-size: 1.1rem; line-height: 1.7; line-break: strict; overflow-wrap: anywhere; }
    .msg-guest .msg-bubble { background: var(--bg-tertiary); color: #fff; border-bottom-left-radius: 2px; }
    .msg-user .msg-bubble { background: rgba(31,173,105,0.15); color: #fff; border: 1px solid rgba(31,173,105,0.3); border-bottom-right-radius: 2px; }
    .msg-label { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .msg-guest .msg-label { text-align: left; }
    .msg-user .msg-label { text-align: right; }
    .chat-choices { padding: 18px 24px; border-top: 1px solid var(--border-default); display: flex; flex-direction: column; gap: 10px; }
    .choices-label { font-size: 0.85rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 4px; text-align: center; }
    .choice-btn { background: transparent; border: 1px solid var(--border-default); color: var(--text-secondary); padding: 13px 18px; border-radius: 5px; text-align: left; font-size: 1.05rem; cursor: pointer; transition: border-color 0.12s, color 0.12s, background 0.12s; line-height: 1.5; line-break: strict; width: 100%; }
    .choice-btn:hover { border-color: var(--accent-blue); color: #fff; background: rgba(241,190,50,0.06); }
    .choice-btn.wrong { border-color: var(--accent-red); color: #e07060; opacity: 0.6; }
    .choice-btn.answered { opacity: 0.4; cursor: default; pointer-events: none; }
    .choice-speak-icon { cursor:pointer; font-size:0.85rem; margin-left:4px; flex-shrink:0; opacity:0.45; transition:opacity 0.18s, transform 0.18s; line-height:1; }
    .choice-speak-icon:hover { opacity:1; transform:scale(1.25); text-shadow:0 0 6px rgba(241,190,50,0.5); }
    .msg-speak-btn { background:none; border:none; cursor:pointer; font-size:0.85rem; padding:0; vertical-align:middle; opacity:0.55; transition:opacity 0.18s, transform 0.18s; }
    .msg-speak-btn:hover { opacity:1; transform:scale(1.25); text-shadow:0 0 6px rgba(241,190,50,0.5); }
    .choice-wrap { display: flex; flex-direction: column; }
    .choice-row { display: flex; gap: 8px; align-items: stretch; }
    .choice-row .choice-btn { flex: 1; }
    .practice-btn { flex-shrink: 0; background: transparent; border: 1px solid var(--border-default); color: var(--text-muted); width: 44px; border-radius: 5px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; transition: border-color 0.12s, color 0.12s, background 0.12s; }
    .practice-btn:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
    .practice-btn.listening { border-color: var(--accent-red); color: var(--accent-red); background: rgba(197,68,42,0.1); animation: mic-pulse 0.9s ease-in-out infinite; }
    .practice-btn.done { border-color: var(--accent-green); color: var(--accent-green); }
    @keyframes mic-pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    .typing-indicator { display:flex; gap:12px; align-items:flex-start; }
    .typing-indicator > div { max-width:50%; }
    .typing-dots { display:flex; align-items:center; gap:5px; padding:14px 18px; background:var(--bg-tertiary); border-radius:8px; border-bottom-left-radius:2px; }
    .typing-dots span { width:8px; height:8px; border-radius:50%; background:var(--text-muted); display:inline-block; animation:typing-bounce 1.2s ease-in-out infinite; }
    .typing-dots span:nth-child(2) { animation-delay:0.2s; }
    .typing-dots span:nth-child(3) { animation-delay:0.4s; }
    @keyframes typing-bounce { 0%,60%,100% { transform:translateY(0); opacity:0.4; } 30% { transform:translateY(-5px); opacity:1; } }
.practice-result { margin-top: 6px; font-size: 0.83rem; padding: 8px 12px; border-radius: 5px; background: var(--bg-tertiary); border: 1px solid var(--border-default); line-height: 1.5; }
.psc-good { color: var(--accent-green); }
.psc-ok   { color: var(--accent-yellow); }
.psc-bad  { color: #e07060; }
.pron-align { display:flex; flex-wrap:wrap; gap:2px; margin:6px 0 4px; font-size:1.1rem; }
.pron-char { display:inline-block; padding:1px 2px; border-radius:3px; min-width:0.6em; text-align:center; transition:background 0.15s; }
.pron-match { color:var(--accent-green); background:rgba(31,173,105,0.1); }
.pron-wrong { color:#e07060; background:rgba(197,68,42,0.12); text-decoration:underline; text-decoration-color:#e07060; }
.pron-extra { color:var(--accent-yellow); background:rgba(241,190,50,0.1); text-decoration:underline; text-decoration-style:dotted; }
.pron-missing { color:var(--text-muted); background:rgba(255,255,255,0.03); opacity:0.5; }
.pron-gap { display:inline-block; width:0.6em; }
.pron-label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); margin-bottom:2px; }
.pron-retry-msg { font-size:0.82rem; color:var(--accent-yellow); margin-top:4px; animation:fadeIn 0.3s; }
.pron-meter { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.pron-meter-track { flex:1; height:6px; background:rgba(255,255,255,0.08); border-radius:3px; overflow:hidden; }
.pron-meter-fill { height:100%; border-radius:3px; animation:meterGrow 0.5s ease-out both; }
@keyframes meterGrow { from { width:0 !important; } }

    .jp-word {
      cursor: pointer;

      transition: border-color 0.15s, background 0.15s;
      border-radius: 2px;
      padding: 0 1px;

      font-size: 0.8em;
      font-style: italic;

      border-bottom-color: var(--accent-yellow);

      content: attr(data-romaji);

<div id="signin-modal" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.65);align-items:center;justify-content:center;">
  <div style="background:var(--bg-secondary);border:1px solid var(--border-default);border-radius:12px;padding:40px 36px;max-width:400px;width:90%;position:relative;">
    <button onclick="closeSignInModal()" style="position:absolute;top:14px;right:18px;background:none;border:none;color:var(--text-secondary);font-size:1.25rem;cursor:pointer;line-height:1;">✕</button>
    <h2 style="font-size:1.15rem;font-weight:700;margin-bottom:6px;">Save your progress</h2>
    <p style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:24px;">Enter your name to track completed lessons. Progress is stored locally in your browser.</p>
    <label style="font-size:0.8rem;color:var(--text-secondary);display:block;margin-bottom:6px;">Your name</label>
    <input id="signin-name" type="text" placeholder="e.g. Tanaka" maxlength="40"
      style="width:100%;padding:10px 14px;border-radius:6px;border:1px solid var(--border-default);background:var(--bg-tertiary);color:#fff;font-size:0.95rem;outline:none;margin-bottom:20px;"
      onkeydown="if(event.key==='Enter')submitSignIn()" />
    <button onclick="submitSignIn()" style="width:100%;background:var(--accent-blue);color:#fff;border:none;border-radius:6px;padding:11px;font-size:0.95rem;font-weight:700;cursor:pointer;">
      Start Learning
    </button>
    <hr style="border:none;border-top:1px solid var(--border-default);margin:20px 0;" />
    <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:10px;">Progress is saved in this browser only. Use export/import to move it across devices.</p>
    <div style="display:flex;gap:8px;">
      <button onclick="exportProgress()" style="flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:6px;padding:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
        Export Progress
      </button>
      <button onclick="importProgress()" style="flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:6px;padding:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
        Import Progress
      </button>
    </div>
  </div>
</div>

// ── QUIZ RENDERER ─────────────────────────────────────────────────────────────
let _quizCounter = 0;
const _quizData = new Map();

function renderQuiz(meta) {
  if (!meta) return '';
  const { type, q, opts, correct, exp, answer, answers, a } = meta;
  const qId = 'q_' + (++_quizCounter);

  if (type === 'mcq') {
    _quizData.set(qId, { type, correct, exp, opts });
    const optHtml = opts.map((o, i) => {
      const letter = String.fromCharCode(65 + i);
      return `<div class="quiz-opt" data-qid="${qId}" data-i="${i}">
        <span class="quiz-opt-letter">${letter}</span>${marked.parseInline(o)}
      </div>`;
    }).join('');
    return `<div class="section-quiz" data-qtype="mcq" data-qid="${qId}">
      <div class="quiz-label">Quiz</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <div class="quiz-options" id="${qId}-opts">${optHtml}</div>
      <button class="quiz-check" id="${qId}-btn" data-qid="${qId}" disabled>Check Answer</button>
      <div class="quiz-feedback" id="${qId}-fb"></div>
    </div>`;
  }
  if (type === 'tf') {
    _quizData.set(qId, { type, correct, exp });
    return `<div class="section-quiz" data-qtype="tf" data-qid="${qId}">
      <div class="quiz-label">True / False</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <div class="tf-options">
        <button class="tf-btn" data-qid="${qId}" data-val="true">True</button>
        <button class="tf-btn" data-qid="${qId}" data-val="false">False</button>
      </div>
      <div class="quiz-feedback" id="${qId}-fb"></div>
    </div>`;
  }
  if (type === 'fitb') {
    _quizData.set(qId, { type, answer, exp, answers });
    return `<div class="section-quiz" data-qtype="fitb" data-qid="${qId}">
      <div class="quiz-label">Fill in the Blank</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <input class="fitb-input" id="${qId}-input" type="text" placeholder="Type your answer…" autocomplete="off" data-qid="${qId}">
      <button class="quiz-check" id="${qId}-check" data-qid="${qId}" data-action="fitb-check">Check Answer</button>
      <div class="quiz-feedback" id="${qId}-fb"></div>
    </div>`;
  }
  if (type === 'short') {
    _quizData.set(qId, { type, a, exp });
    return `<div class="section-quiz" data-qtype="short" data-qid="${qId}">
      <div class="quiz-label">Short Answer</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <textarea class="short-input" id="${qId}-input" placeholder="Write your answer here…"></textarea>
      <button class="quiz-check" data-qid="${qId}" data-action="show-model">Show Model Answer</button>
      <div class="model-answer" id="${qId}-ma"></div>
    </div>`;
  }
  if (type === 'match') {
    const correctStr = JSON.stringify(correct);
    _quizData.set(qId, { type, correct, exp, opts });
    const pairHtml = opts.map(function(p, i) {
      return `<div class="match-row" data-i="${i}">
        <span class="match-left">${p[0]}</span>
        <span class="match-arrow">→</span>
        <select class="match-select" id="${qId}-sel-${i}" data-qid="${qId}">
          <option value=""></option>${p[1].split(',').map(function(s, j) {
            return `<option value="${j}">${s.trim()}</option>`
          }).join('')}
        </select>
      </div>`;
    }).join('');
    return `<div class="section-quiz" data-qtype="match" data-qid="${qId}" data-match-correct="${correctStr.replace(/"/g,'&quot;')}">
      <div class="quiz-label">Matching</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <div class="match-pairs" id="${qId}-list">${pairHtml}</div>
      <button class="quiz-check" data-qid="${qId}" data-action="match-submit" disabled>Check Answers</button>
      <div class="quiz-feedback" id="${qId}-fb"></div>
    </div>`;
  }
  if (type === 'order') {
    _quizData.set(qId, { type, correct, exp });
    const itemHtml = opts.map(function(item, i) {
      return `<div class="order-item" data-qid="${qId}" data-i="${i}" draggable="true">
        <span class="order-grip">⠿</span>
        <span class="order-num">${i + 1}</span>
        <span class="order-text">${item}</span>
        <span class="order-btns">
          <button class="order-btn" data-qid="${qId}" data-idx="${i}" data-dir="up" type="button" aria-label="Move up">▲</button>
          <button class="order-btn" data-qid="${qId}" data-idx="${i}" data-dir="down" type="button" aria-label="Move down">▼</button>
        </span>
      </div>`;
    }).join('');
    return `<div class="section-quiz" data-qtype="order" data-qid="${qId}">
      <div class="quiz-label">Ordering</div>
      <div class="quiz-q">${marked.parseInline(q)}</div>
      <div class="order-list" id="${qId}-list">${itemHtml}</div>
      <button class="quiz-check" data-qid="${qId}" data-action="order-check">Check Order</button>
      <div class="quiz-feedback" id="${qId}-fb"></div>
    </div>`;
  }
  return '';
}
// ── QUIZ EVENT DELEGATION ──────────────────────────────────────────────────────
function initQuizInteractions() {
  const main = document.getElementById('main');
  if (!main) return;

  main.addEventListener('click', function(e) {
    const jpSpeak = e.target.closest('.jp-speak');
    if (jpSpeak) {
      speakJapanese(jpSpeak.textContent.trim(), jpSpeak);
      return;
    }
    const opt = e.target.closest('.quiz-opt');
    if (opt) {
      const qId = opt.dataset.qid;
      if (!qId) return;
      document.querySelectorAll('#' + qId + '-opts .quiz-opt').forEach(function(o) { o.classList.remove('selected') });
      opt.classList.add('selected');
      var btn = document.getElementById(qId + '-btn');
      if (btn) btn.disabled = false;
      return;
    }
  });

  main.addEventListener('click', function(e) {
    var tfBtn = e.target.closest('.tf-btn');
    if (!tfBtn) return;
    var qId = tfBtn.dataset.qid;
    if (!qId) return;
    var qData = _quizData.get(qId);
    if (!qData) return;
    var val = tfBtn.dataset.val === 'true';
    var quizEl = tfBtn.closest('.section-quiz');
    if (!quizEl) return;
    var fb = quizEl.querySelector('.quiz-feedback');
    if (!fb) return;
    var allBtns = quizEl.querySelectorAll('.tf-btn');
    fb.style.display = 'block';
    if (val === qData.correct) {
      allBtns.forEach(function(b) { b.disabled = true });
      tfBtn.classList.add('correct');
      fb.className = 'quiz-feedback ok';
      fb.textContent = '✓ Correct!';
      setTimeout(showCompletionModal, 600);
    } else {
      tfBtn.classList.add('wrong');
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Incorrect. Try again.';
      setTimeout(function() {
        tfBtn.classList.remove('wrong');
        fb.style.display = 'none';
      }, 800);
    }
  });

  main.addEventListener('click', function(e) {
    var checkBtn = e.target.closest('.quiz-check');
    if (!checkBtn) return;
    handleQuizCheck(checkBtn);
  });

  main.addEventListener('click', function(e) {
    var orderBtn = e.target.closest('.order-btn');
    if (!orderBtn) return;
    handleOrderBtn(orderBtn);
  });

  main.addEventListener('keydown', function(e) {
    var input = e.target.closest('.fitb-input');
    if (!input || e.key !== 'Enter') return;
    var qId = input.dataset.qid;
    if (!qId) return;
    var qData = _quizData.get(qId);
    if (!qData) return;
    var fb = document.getElementById(qId + '-fb');
    if (!fb) return;
    var val = input.value.trim();
    if (!val) return;
    var accepted = [qData.answer].concat(qData.answers || []);
    var romajiMatch = qData.exp.match(/\(([a-zA-Z][^)]*)\)/);
    if (romajiMatch) accepted.push(romajiMatch[1].trim());
    var ok = accepted.some(function(a) { return val === a || val.toLowerCase() === a.toLowerCase() });
    fb.style.display = 'block';
    if (ok) {
      input.disabled = true;
      var checkBtn = document.getElementById(qId + '-check');
      if (checkBtn) checkBtn.disabled = true;
      fb.className = 'quiz-feedback ok';
      fb.textContent = '✓ Correct!';
      setTimeout(showCompletionModal, 600);
    } else {
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Incorrect. Try again.';
    }
  });

  main.addEventListener('change', function(e) {
    var sel = e.target.closest('.match-select');
    if (!sel) return;
    var qId = sel.dataset.qid;
    if (!qId) return;
    var list = document.getElementById(qId + '-list');
    if (!list) return;
    var selects = list.querySelectorAll('.match-select');
    var allSelected = true;
    selects.forEach(function(s) { if (!s.value) allSelected = false });
    var quizEl = list.closest('.section-quiz');
    if (!quizEl) return;
    var btn = quizEl.querySelector('.quiz-check');
    if (btn) btn.disabled = !allSelected;
  });
}

function handleQuizCheck(btn) {
  var qId = btn.dataset.qid;
  if (!qId) return;
  var qData = _quizData.get(qId);
  if (!qData) return;
  var _isVocabFile = (new URLSearchParams(location.search).get('file') || '').includes('/vocabulary/');

  if (qData.type === 'mcq') {
    var opts = document.querySelectorAll('#' + qId + '-opts .quiz-opt');
    var sel = -1;
    opts.forEach(function(o, i) { if (o.classList.contains('selected')) sel = i });
    if (sel < 0) return;
    var fb = document.getElementById(qId + '-fb');
    if (!fb) return;
    fb.style.display = 'block';
    if (sel === qData.correct) {
      opts[qData.correct].classList.add('correct');
      btn.disabled = true;
      fb.className = 'quiz-feedback ok';
      fb.innerHTML = '✓ Correct!' + (qData.exp ? '<div style="margin-top:8px;font-size:0.88rem;line-height:1.5;opacity:0.9;">' + qData.exp + '</div>' : '');
      setTimeout(showCompletionModal, 600);
    } else {
      opts[sel].classList.add('wrong');
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Incorrect. ' + (qData.exp || 'Try again.');
      opts[sel].classList.remove('wrong', 'selected');
      btn.disabled = false;
    }
    return;
  }

  if (qData.type === 'fitb') {
    var input = document.getElementById(qId + '-input');
    if (!input) return;
    var fb = document.getElementById(qId + '-fb');
    if (!fb) return;
    var val = input.value.trim();
    if (!val) return;
    var accepted = [qData.answer].concat(qData.answers || []);
    var romajiMatch = qData.exp.match(/\(([a-zA-Z][^)]*)\)/);
    if (romajiMatch) accepted.push(romajiMatch[1].trim());
    var ok = accepted.some(function(a) { return val === a || val.toLowerCase() === a.toLowerCase() });
    fb.style.display = 'block';
    if (ok) {
      input.disabled = true;
      btn.disabled = true;
      fb.className = 'quiz-feedback ok';
      fb.textContent = '✓ Correct!';
      setTimeout(showCompletionModal, 600);
    } else {
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Incorrect. ' + (qData.exp || 'Try again.');
    }
    return;
  }

  if (qData.type === 'match') {
    var list = document.getElementById(qId + '-list');
    if (!list) return;
    var quizEl = list.closest('.section-quiz');
    if (!quizEl) return;
    var selects = list.querySelectorAll('.match-select');
    var correct = JSON.parse(quizEl.getAttribute('data-match-correct') || '[]');
    var ok = true;
    selects.forEach(function(s, i) {
      var val = parseInt(s.value);
      if (isNaN(val)) { ok = false; return; }
      if (val !== correct[i]) { s.classList.add('wrong'); ok = false; }
      else s.classList.add('correct');
    });
    var fb = quizEl.querySelector('.quiz-feedback');
    if (!fb) return;
    fb.style.display = 'block';
    if (ok) {
      fb.className = 'quiz-feedback ok';
      fb.textContent = '✓ Correct!';
      setTimeout(showCompletionModal, 600);
    } else {
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Some answers are wrong. ' + (qData.exp || 'Try again.');
      setTimeout(function() {
        selects.forEach(function(s) { s.classList.remove('wrong') });
      }, 1200);
    }
    return;
  }

  if (qData.type === 'order') {
    var list = document.getElementById(qId + '-list');
    if (!list) return;
    var items = list.querySelectorAll('.order-item');
    var current = Array.from(items).map(function(el) { return parseInt(el.dataset.i) });
    var ok = current.every(function(v, i) { return v === qData.correct[i] });
    var quizEl = list.closest('.section-quiz');
    if (!quizEl) return;
    var fb = quizEl.querySelector('.quiz-feedback');
    if (!fb) return;
    fb.style.display = 'block';
    if (ok) {
      items.forEach(function(el) { el.style.borderColor = '#2ecc71' });
      fb.className = 'quiz-feedback ok';
      fb.textContent = '✓ Correct order! ' + qData.exp;
      setTimeout(showCompletionModal, 600);
    } else {
      items.forEach(function(el) { el.style.borderColor = '#c5442a' });
      fb.className = 'quiz-feedback err';
      fb.textContent = '✗ Incorrect order. ' + (qData.exp || 'Try again.');
      setTimeout(function() {
        items.forEach(function(el) { el.style.borderColor = '' });
      }, 1200);
    }
    return;
  }

  if (qData.type === 'short') {
    var ma = document.getElementById(qId + '-ma');
    if (!ma) return;
    ma.style.display = 'block';
    ma.innerHTML = '<strong>Model Answer</strong><br>' + qData.a + '<br><br>' + qData.exp;
    setTimeout(showCompletionModal, 600);
    return;
  }
}

function handleOrderBtn(orderBtn) {
  var qId = orderBtn.dataset.qid;
  var idx = parseInt(orderBtn.dataset.idx);
  var dir = orderBtn.dataset.dir;
  if (!qId || isNaN(idx)) return;
  if (dir === 'up') {
    if (idx === 0) return;
    swapOrderItems(qId, idx, idx - 1);
  } else if (dir === 'down') {
    var list = document.getElementById(qId + '-list');
    if (!list) return;
    var items = list.querySelectorAll('.order-item');
    if (idx >= items.length - 1) return;
    swapOrderItems(qId, idx, idx + 1);
  }
}

// ── COMPLETION MODAL ─────────────────────────────────────────────────────────
function showCompletionModal() {
  const file = new URLSearchParams(location.search).get('file') || '';
  const m = file.match(/\/([^/]+)-(\d+)\.md$/);
  if (m) localStorage.setItem('omotenashi:' + m[1] + ':' + parseInt(m[2], 10), '1');
  // SRS: track review schedule per file
  if (file && !file.startsWith('scenarios/')) {
    const srsKey = 'omotenashi:srs:' + file;
    let srs = {};
    try { srs = JSON.parse(localStorage.getItem(srsKey) || '{}'); } catch(e) {}
    const reps = (srs.reps || 0) + 1;
    const intervals = [1, 3, 7, 14, 30];
    const interval = intervals[Math.min(reps - 1, 4)];
    localStorage.setItem(srsKey, JSON.stringify({ reps, interval, nextReview: Date.now() + interval * 86400000 }));
  }
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (document.getElementById('modalOverlay').classList.contains('open')) {
      window.location.href = window._nextUrl || 'curriculum.html';
    }
  }
  if (e.key === 'Escape') closeModal();
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'ArrowLeft' && window._prevFile) {
    window.location.href = 'md-viewer.html?file=' + encodeURIComponent(window._prevFile);
  }
  if (e.key === 'ArrowRight' && window._nextFile) {
    window.location.href = 'md-viewer.html?file=' + encodeURIComponent(window._nextFile);
  }
  // A/B/C/D to select MCQ option
  if (/^[A-Da-d]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (document.getElementById('modalOverlay').classList.contains('open')) return;
    const quiz = document.querySelector('[data-qtype="mcq"]');
    if (!quiz) return;
    const fb = document.getElementById(quiz.dataset.qid + '-fb');
    if (fb && fb.style.display === 'block') return;
    const idx = e.key.toUpperCase().charCodeAt(0) - 65;
    const opts = quiz.querySelectorAll('.quiz-opt');
    if (idx < opts.length) {
      opts.forEach(o => o.classList.remove('selected'));
      opts[idx].classList.add('selected');
      const btn = quiz.querySelector('.quiz-check');
      if (btn) btn.disabled = false;
      e.preventDefault();
    }
  }
  // Enter to submit active quiz check button
  if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) {
    if (document.getElementById('modalOverlay').classList.contains('open')) return;
    const btn = document.querySelector('.section-quiz .quiz-check:not([disabled])');
    if (btn) { btn.click(); e.preventDefault(); }
  }
});

let _toastTimer = null;
let _activeSpeakEl = null;
let _ttsQueue = [];
let _ttsPlaying = false;

function speakJapanese(text, el) {
  if (!text) return;
  _ttsQueue.push({ text, el });
  if (!_ttsPlaying) _ttsProcessQueue();
}

function _ttsProcessQueue() {
  if (!_ttsQueue.length) { _ttsPlaying = false; return; }
  _ttsPlaying = true;
  var item = _ttsQueue.shift();
  var text = item.text, el = item.el;
  speechSynthesis.cancel();

  if (_activeSpeakEl) { _activeSpeakEl.classList.remove('speaking'); }
  _activeSpeakEl = el || null;
  if (_activeSpeakEl) _activeSpeakEl.classList.add('speaking');

  const toast = document.getElementById('jp-toast');
  document.getElementById('jp-toast-text').textContent = text;
  toast.classList.add('show');
  clearTimeout(_toastTimer);

  // Chrome needs a small delay after cancel() before speak()
  setTimeout(() => {
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'ja-JP';
    utt.rate  = _jaVoiceParams ? _jaVoiceParams.rate  : 0.85;
    utt.pitch = _jaVoiceParams ? _jaVoiceParams.pitch : 1.0;
    if (_jaVoice) utt.voice = _jaVoice;

    utt.onend = () => {
      if (_activeSpeakEl) { _activeSpeakEl.classList.remove('speaking'); _activeSpeakEl = null; }
      _toastTimer = setTimeout(() => toast.classList.remove('show'), 800);
      _ttsProcessQueue();
    };
    utt.onerror = () => {
      if (_activeSpeakEl) { _activeSpeakEl.classList.remove('speaking'); _activeSpeakEl = null; }
      toast.classList.remove('show');
      _ttsProcessQueue();
    };
    speechSynthesis.speak(utt);
  }, 50);
}

// Wrap Japanese character runs in .section-body with clickable spans
function wrapJapanese(root) {
  const JP_RE = /([\u3040-\u9FFF\uFF00-\uFFEF]+)/g;

  // Recursive walk - collect text nodes safely before mutating
  function collectTextNodes(node, acc) {
    if (node.nodeType === 3) { acc.push(node); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName;
    if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'CODE' || tag === 'PRE') return;
    if (node.classList && node.classList.contains('dialogue-bubble')) return;
    node.childNodes.forEach(c => collectTextNodes(c, acc));
  }
  const textNodes = [];
  collectTextNodes(root, textNodes);

  textNodes.forEach(tn => {
    const text = tn.textContent;
    if (!JP_RE.test(text)) { JP_RE.lastIndex = 0; return; }
    JP_RE.lastIndex = 0;

    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = JP_RE.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'jp-word';
      span.setAttribute('lang', 'ja');
      span.textContent = m[0];             // text captured at this iteration
      span.title = 'クリックで発音を聞く';
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  });
}

// Make .keigo-jp code elements speakable + extract adjacent romaji for hover tooltip
function wrapKeigoJpCodes(root) {
  root.querySelectorAll('.keigo-jp code').forEach(code => {
    code.classList.add('jp-word');
    code.title = 'クリックで発音を聞く';

    // Find adjacent <em> romaji: pattern is .keigo-jp<br><em>romaji</em>
    const parent = code.closest('.keigo-jp');
    if (!parent) return;
    let sib = parent.nextSibling;
    while (sib && (sib.nodeType === Node.TEXT_NODE || (sib.nodeType === Node.ELEMENT_NODE && sib.tagName === 'BR'))) {
      sib = sib.nextSibling;
    }
    if (sib && sib.nodeType === Node.ELEMENT_NODE && sib.tagName === 'EM') {
      code.dataset.romaji = sib.textContent.trim();
    }
  });
}

// ── FRONTMATTER PARSER ────────────────────────────────────────────────────────
function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { meta: {}, body: raw };
  const meta = {};
  match[1].split('\n').forEach(line => {
    const [k, ...v] = line.split(':');
    if (k) meta[k.trim()] = v.join(':').trim();
  });
  return { meta, body: match[2] };
}

// ── QUIZ BLOCK PARSER ─────────────────────────────────────────────────────────
function extractQuizBlock(body) {
  const dividerIdx = body.lastIndexOf('\n---\n');
  if (dividerIdx < 0) return { content: body, quizRaw: null };
  return {
    content: body.slice(0, dividerIdx),
    quizRaw: body.slice(dividerIdx + 5)
  };
}

function parseQuizMarkdown(raw) {
  if (!raw) return null;
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l);

  // Prefer **Question:** line; fall back to first non-excluded bold block
  const questionLine = lines.find(l => l.startsWith('**Question:**'));
  let q = '';
  if (questionLine) {
    q = questionLine.replace('**Question:**', '').trim();
  } else {
    const boldBlocks = [...raw.matchAll(/\*\*([\s\S]*?)\*\*/g)];
    const qBlock = boldBlocks.find(m => {
      const t = m[1].trim();
      return !t.startsWith('Correct') && !t.startsWith('Answer:') && !t.startsWith('Question:') && !t.startsWith('Fill in the blank') && !t.startsWith('Explanation:') && !t.startsWith('Model Answer:');
    });
    q = qBlock ? qBlock[1].trim() : '';
  }

  const optLines = lines.filter(l => /^- [A-D]\./.test(l));
  const correctLine = lines.find(l => l.startsWith('**Correct Answer:**'));
  const answerLine = lines.find(l => l.startsWith('**Answer:**'));
  const modelLine = lines.find(l => l.startsWith('**Model Answer:**'));
  const expLine = lines.find(l => l.startsWith('**Explanation:**'));
  const exp = expLine ? expLine.replace('**Explanation:**', '').trim() : '';

  if (optLines.length > 0) {
    // MCQ
    const opts = optLines.map(l => l.replace(/^- [A-D]\.\s*/, ''));
    const correctText = correctLine ? correctLine.replace('**Correct Answer:**', '').trim() : '';
    let correct = -1;
    // If answer is a single letter A-D, convert to index directly
    if (/^[A-Da-d]$/.test(correctText)) {
      correct = correctText.toUpperCase().charCodeAt(0) - 65;
    } else {
      const norm = s => s.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').replace(/\s+\(/g, '(').trim().toLowerCase();
      correct = opts.findIndex(o => norm(o) === norm(correctText));
      if (correct < 0) correct = opts.findIndex(o => norm(o).startsWith(norm(correctText)) || norm(correctText).startsWith(norm(o)));
    }
    return { type: 'mcq', q, opts, correct: correct >= 0 ? correct : 0, exp };
  }
  if (answerLine && !modelLine) {
    const ans = answerLine.replace('**Answer:**', '').trim();
    if (ans === 'True' || ans === 'False') {
      return { type: 'tf', q, correct: ans === 'True', exp };
    }
    return { type: 'fitb', q, answer: ans, exp };
  }
  if (modelLine) {
    return { type: 'short', q, a: modelLine.replace('**Model Answer:**', '').trim(), exp };
  }

  // Matching: lines with `→` separator
  const matchLines = lines.filter(l => l.includes('→'));
  if (matchLines.length >= 2) {
    const pairs = matchLines.map(l => l.split('→').map(s => s.trim()));
    var order = [];
    const leftItems = pairs.map(function(p, i) {
      order.push(i);
      return p[0];
    });
    const rightItems = pairs.map(function(p) { return p[1]; });
    return { type: 'match', q, opts: leftItems.map(function(l, i) { return [l, rightItems.join(',')]; }), correct: order.map(function(_, i) { return i; }), exp };
  }

  // Ordering: lines starting with `- ` or `* ` when no MCQ prefix
  const orderLines = lines.filter(l => /^- /.test(l) && !/^- [A-D]\./.test(l));
  if (orderLines.length >= 2) {
    const items = orderLines.map(l => l.replace(/^- /, '').trim());
    return { type: 'order', q, opts: items, correct: items.map(function(_, i) { return i; }), exp };
  }

  return null;
}

let _vocabActiveRec = null;
function vocabPractice(jp, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const fb = document.getElementById('vocabPronFeedback');
  if (!SR) { if (fb) fb.innerHTML = '<div class="pron-score" style="color:#e07060;">Speech recognition not supported. Try Chrome.</div>'; return; }
  if (_vocabActiveRec) { _vocabActiveRec.abort(); _vocabActiveRec = null; btn.style.opacity = ''; btn.textContent = '🎤 Practice'; return; }
  const recognition = new SR();
  recognition.lang = 'ja-JP';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;
  _vocabActiveRec = recognition;
  btn.style.opacity = '0.6';
  btn.textContent = '🔴 Listening…';
  let got = false;
  recognition.onresult = e => {
    got = true; _vocabActiveRec = null; btn.style.opacity = ''; btn.textContent = '🎤 Practice';
    const best = Array.from(e.results[0]).reduce((a, b) => a.confidence > b.confidence ? a : b);
    const analysis = simAnalyzePronunciation(best.transcript.trim(), jp);
    vocabShowScore(analysis, best.transcript.trim(), best.confidence);
  };
  recognition.onerror = (e) => {
    _vocabActiveRec = null; btn.style.opacity = ''; btn.textContent = '🎤 Practice';
    if (fb) {
      const msg = e.error === 'not-allowed'  ? 'Microphone access denied. Check browser permissions.' :
                  e.error === 'no-speech'    ? 'No speech detected. Speak closer to the mic.' :
                  e.error === 'network'      ? 'Network error. Speech recognition requires internet.' :
                  e.error === 'aborted'      ? '' :
                  'Recognition failed (' + e.error + '). Try again.';
      if (msg) { fb.innerHTML = '<div class="pron-score" style="color:#e07060;">' + msg + '</div>'; fb.style.display = 'block'; }
    }
  };
  recognition.onend = () => {
    if (!got) {
      _vocabActiveRec = null; btn.style.opacity = ''; btn.textContent = '🎤 Practice';
      if (fb && !fb.querySelector('.pron-score')) {
        fb.innerHTML = '<div class="pron-score" style="color:#e07060;">No speech detected. Try speaking closer to the mic.</div>';
        fb.style.display = 'block';
      }
    }
  };
  try { recognition.start(); } catch(e) {
    _vocabActiveRec = null; btn.style.opacity = ''; btn.textContent = '🎤 Practice';
    if (fb) { fb.innerHTML = '<div class="pron-score" style="color:#e07060;">Could not start microphone. Try again.</div>'; fb.style.display = 'block'; }
  }
}

function vocabShowScore(analysis, heard, confidence) {
  const fb = document.getElementById('vocabPronFeedback');
  if (!fb) return;
  if (!analysis) { fb.style.display = 'none'; return; }
  const score = analysis.score;
  const isGood = score >= 85, isOk = score >= 65;
  const cls = isGood ? 'ok' : isOk ? 'ok' : 'err';
  const fillColor = isGood ? 'var(--accent-green)' : 'var(--accent-yellow)';
  const label = isGood ? 'Perfect!' : isOk ? 'Good' : 'Try Again';
  let matchCnt = 0, wrongCnt = 0, extraCnt = 0, missingCnt = 0;
  if (analysis.expected) analysis.expected.forEach(function(c) {
    if (c.status === 'match') matchCnt++; else if (c.status === 'wrong') wrongCnt++; else if (c.status === 'missing') missingCnt++;
  });
  if (analysis.spoken) analysis.spoken.forEach(function(c) { if (c.status === 'extra') extraCnt++; });
  let parts = [];
  if (matchCnt) parts.push('<span style="color:var(--accent-green);">' + matchCnt + ' correct</span>');
  if (wrongCnt) parts.push('<span style="color:#e07060;">' + wrongCnt + ' wrong</span>');
  if (extraCnt) parts.push('<span style="color:var(--accent-yellow);">+' + extraCnt + '</span>');
  if (missingCnt) parts.push('<span style="color:var(--text-muted);">-' + missingCnt + '</span>');
  let alignHtml = '';
  if (analysis.expected && analysis.expected.length) {
    alignHtml += simBuildAlignHtml(analysis.expected, 'Expected');
  }
  if (analysis.spoken && analysis.spoken.length) {
    alignHtml += simBuildAlignHtml(analysis.spoken, 'You said');
  }
  fb.className = 'quiz-feedback ' + cls;
  fb.style.cssText = '';
  if (!isGood && isOk) {
    fb.style.background = 'rgba(241,190,50,0.1)';
    fb.style.borderColor = 'rgba(241,190,50,0.3)';
  }
  fb.innerHTML = '<div class="pron-meter">' +
    '<div class="pron-meter-track"><div class="pron-meter-fill" style="width:' + score + '%;background:' + fillColor + ';"></div></div>' +
    '<span style="font-weight:700;font-size:0.85rem;color:' + fillColor + ';">' + score + '% ' + label + '</span>' +
    '</div>' +
    (parts.length ? '<div class="pron-summary">' + parts.join(' · ') + '</div>' : '') +
    (heard ? '<div class="pron-utterance">💬 ' + escapeHtml(heard) + '</div>' : '') +
    alignHtml;
  fb.style.display = 'block';
}

function parseMD(text) {
  const fm = {};
  const fmMatch = text.match(/^---\n([\s\S]*?)\n---/);
  if (fmMatch) {
    fmMatch[1].split('\n').forEach(line => {
      const colon = line.indexOf(':');
      if (colon > -1) fm[line.slice(0, colon).trim()] = line.slice(colon + 1).trim();
    });
  }
  const turns = [];
  const sections = text.split(/^## Turn \d+/m).slice(1);
  for (const sec of sections) {
    const sysM   = sec.match(/\*\*System:\*\*\s*(.+)/);
    const guestM = sec.match(/\*\*Guest:\*\*\s*(.+)/);
    const jpM    = sec.match(/\*\*Guest JP:\*\*\s*(.+)/);
    const choices = [];
    const re = /^- \[(\d)\] (.+)\n  - EN: (.+)\n  - Feedback: (.+)/gm;
    let m;
    while ((m = re.exec(sec)) !== null) {
      choices.push({ score: parseInt(m[1]), text: m[2].trim(), label: m[3].trim(), feedback: m[4].trim() });
    }
    if (guestM && choices.length) {
      turns.push({ system: sysM ? sysM[1].trim() : '', guest: guestM[1].trim(), guestJp: jpM ? jpM[1].trim() : '', choices });
    }
  }
  if (!turns.length) return null;
  return { id: parseInt(fm.id), title: fm.title, description: fm.description, turns };
}

      _jaVoice = jaVoices[0];
      _jaVoiceParams = { rate: 0.83, pitch: 1.0 };

    if (jpNames.length > 0) {
      _jaVoiceSecondary = jpNames[0];

  if (_jaVoice && !_jaVoiceSecondary) {

    utter.voice = finalVoice;
    utter.rate  = rate;
    utter.pitch = chunkPitch;
    utter.volume = 1.0;
    utter.onend = () => speakChunk(i + 1);
    utter.onerror = (e) => {
      if (e && e.error !== 'interrupted') showTtsToast('音声の再生に失敗しました。');
    };
    speechSynthesis.speak(utter);

    if (_ttsKeepAliveTimer) clearTimeout(_ttsKeepAliveTimer);

  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)

      eRes.unshift({ char: b[j - 1], status: 'match' });

  if (analysis.expected && analysis.expected.length) {
    alignHtml += simBuildAlignHtml(analysis.expected, 'Expected');
  }
  if (analysis.spoken && analysis.spoken.length) {
    alignHtml += simBuildAlignHtml(analysis.spoken, 'You said');
  }
  el.innerHTML = scoreBarHtml + msgHtml + summaryHtml + utteranceHtml + alignHtml;
}

function simMatchChoice(transcript, choices) {
  const t = simNorm(transcript);
  if (!t) return null;
  let bestIdx = null, bestScore = 0;
  choices.forEach(function(c, idx) {
    const ct = simNorm(c.text);
    // Simple substring + overlap scoring
    let score = 0;
    if (ct.includes(t) || t.includes(ct)) {
      score = Math.min(t.length, ct.length) / Math.max(t.length, ct.length) * 100;
    } else {
      // Character overlap
      var matchCount = 0;
      for (var i = 0; i < t.length; i++) { if (ct.indexOf(t[i]) >= 0) matchCount++; }
      score = (matchCount / Math.max(t.length, ct.length)) * 50;
    }
    if (score > bestScore) { bestScore = score; bestIdx = idx; }
  });
  return bestScore > 30 ? bestIdx : null;
}

}

// ── DIALOGUE EXTENSION FOR MARKED ──────────────────────────────────────────
marked.use({
  extensions: [{
    name: 'dialogue',
    level: 'block',
    start(src) { return src.match(/^```dialogue\s*\n/m)?.index; },
    tokenizer(src) {
      const match = src.match(/^```dialogue\s*\n([\s\S]*?)```/);
      if (match) {
        return { type: 'dialogue', raw: match[0], text: match[1] };
      }
    },
    renderer(token) {
      const lines = token.text.split('\n');
      let html = '<div class="dialogue">';
      let currentRole = null;
      let currentText = [];
      function flush() {
        if (!currentRole || !currentText.length) return;
        const cls = currentRole === 'Staff' ? 'dialogue-staff' : 'dialogue-guest';
        const label = currentRole === 'Staff' ? 'Staff' : 'Guest';
        html += `<div class="dialogue-line ${cls}"><span class="dialogue-label">${label}</span><span class="dialogue-bubble">${currentText.join('<br>')}</span></div>`;
        currentText = [];
      }
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        const staffMatch = trimmed.match(/^Staff:\s{4}(.*)/);
        const guestMatch = trimmed.match(/^Guest:\s{4}(.*)/);
        if (staffMatch) { flush(); currentRole = 'Staff'; currentText.push(staffMatch[1]); }
        else if (guestMatch) { flush(); currentRole = 'Guest'; currentText.push(guestMatch[1]); }
        else if (/^\(/.test(trimmed)) { flush(); currentRole = null; html += `<div class="dialogue-stage">${trimmed}</div>`; }
        else { currentText.push(trimmed); }
      }
      flush();
      html += '</div>';
      return html;
    }
  }]
});

async function render() {
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  if (!file) {
    document.getElementById('main').innerHTML = '<div class="loading">No file specified. <a href="curriculum.html" style="color:var(--accent-blue);">← Back to Curriculum</a></div>';
    return;
  }

  // Validate file against known files to prevent path traversal
  const isKnownContent = !!FILE_MAP[file];
  const isKnownScenario = /^scenarios\/\d+\.md$/.test(file);
  if (!isKnownContent && !isKnownScenario) {
    document.getElementById('main').innerHTML = '<div class="loading">Invalid file. <a href="curriculum.html" style="color:var(--accent-blue);">← Back to Curriculum</a></div>';
    return;
  }

  const info = FILE_MAP[file] || {};

  let raw;
  try {
    const base = location.pathname.replace(/\/pages\/[^/]*$/, '/');
    const res = await fetch(base + file);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = (await res.text()).replace(/\r\n/g, '\n');
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="loading">Could not load file (${e.message}). <button onclick="location.reload()" style="background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-default);border-radius:4px;padding:6px 14px;cursor:pointer;margin:0 8px;font:inherit;">Retry</button> <a href="curriculum.html" style="color:var(--accent-blue);">← Back to Curriculum</a></div>`;
    return;
  }

  // Detect scenario file and render simulator
  if (/^scenarios\/\d+\.md$/.test(file)) {
    const scenario = parseMD(raw);
    if (scenario) { renderSimulator(scenario, file, info); return; }
  }

  const { meta, body } = parseFrontmatter(raw);
  const { content, quizRaw } = extractQuizBlock(body);
  const quiz = parseQuizMarkdown(quizRaw);

  const sectionTitle = meta.title || '';
  const moduleLabel = info.module || 'The Spirit of Omotenashi';
  const lessonLabel = info.lesson || '';
  const sectionNum = info.section || meta.section || '';
  const total = info.total || '';

  document.title = sectionTitle + ' - Omotenashi Training';

  // Save last visited lesson for "Continue" banner on homepage
  try { localStorage.setItem('omotenashi:lastLesson', JSON.stringify({ file, title: sectionTitle, module: moduleLabel })); } catch(e) {}

  // Nav info (must be declared before modal setup)
  const prevFile = info.prev;
  const nextFile = info.next;
  window._prevFile = prevFile;
  window._nextFile = nextFile;

  // Set next URL for modal
  window._nextUrl = nextFile ? `md-viewer.html?file=${encodeURIComponent(nextFile)}` : 'curriculum.html';
  const pct = total ? Math.round((sectionNum / total) * 100) : 100;
  document.getElementById('modalSectionTitle').textContent = sectionTitle;
  document.getElementById('modalProgressFill').style.width = pct + '%';
  document.getElementById('modalPercent').textContent = pct + '% complete';
  const nextBtn = document.getElementById('modalNextBtn');
  nextBtn.href = window._nextUrl;
  nextBtn.innerHTML = nextFile
    ? `Go to next section <span class="btn-next-sub">(Ctrl + Enter)</span>`
    : 'Back to Curriculum';

  // Breadcrumb
  const breadcrumb = `<div class="breadcrumb">
    <a href="curriculum.html">Curriculum</a>
    <span>/</span>
    <a href="curriculum.html">${moduleLabel}</a>
    <span>/</span>
    <span>${lessonLabel}</span>
  </div>`;

  // Pre-process dialogue blocks to raw HTML (bypasses marked extension issues)
  let processedContent = content.replace(/```dialogue\s*\n([\s\S]*?)```/g, (match, text) => {
    const lines = text.split('\n');
    let html = '<div class="dialogue">';
    let currentRole = null;
    let currentText = [];
    let currentEn = [];
    function flush() {
      if (!currentRole || !currentText.length) return;
      const cls = currentRole === 'Staff' ? 'dialogue-staff' : 'dialogue-guest';
      const label = currentRole === 'Staff' ? 'Staff' : 'Guest';
      const jp = currentText.join('<br>');
      const enHtml = currentEn.length ? `<div class="dialogue-en">${currentEn.join('<br>')}</div>` : '';
      html += `<div class="dialogue-line ${cls}"><span class="dialogue-label">${label}</span><span class="dialogue-bubble">${jp}${enHtml}</span></div>`;
      currentText = [];
      currentEn = [];
    }
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const enMatch = trimmed.match(/^\(EN\)\s{2,}(.*)/);
      if (enMatch) {
        currentEn.push(enMatch[1]);
        continue;
      }
      const speakerMatch = trimmed.match(/^(Staff|Guest)(?:\s+\w+)?:\s{2,}(.*)/);
      if (speakerMatch) {
        flush();
        currentRole = speakerMatch[1];
        currentText.push(speakerMatch[2]);
      } else if (/^\(/.test(trimmed)) {
        flush();
        currentRole = null;
        html += `<div class="dialogue-stage">${trimmed}</div>`;
      } else {
        currentText.push(trimmed);
      }
    }

  // Romaji lookup for dialogue phrases (split by でございます。/ございます。/でしょうか？ etc.)
  function _romajiFor(text) {
    if (_ROMAJI[text]) return _ROMAJI[text];
    // Try partial match from dictionary
    for (const [jp, rom] of Object.entries(_ROMAJI)) {
      if (text.includes(jp)) return rom;
    }
    return '';
  }

  // ── Remove .jp-word underlines everywhere EXCEPT inside .dialogue blocks ──
  // Also add romaji to Key Phrases tables
  if (bodyEl) {

      if (span.closest('.dialogue')) return;
      if (span.tagName === 'CODE') return;
      const p = span.parentNode;
      if (!p) return;
      p.replaceChild(document.createTextNode(span.textContent), span);
      p.normalize();
    });
    // Add romaji to Key Phrases from the Dialogue tables
    bodyEl.querySelectorAll('h2').forEach(h2 => {
      if (h2.textContent.trim() !== 'Key Phrases from the Dialogue') return;
      let el = h2.nextElementSibling;
      while (el && el.tagName !== 'H2') {
        if (el.tagName === 'TABLE') {
          el.querySelectorAll('tr').forEach((tr, i) => {
            if (i === 0) return;
            const firstCol = tr.querySelector('td:first-child');
            if (!firstCol) return;
            const jpText = firstCol.textContent.trim();
            const romaji = _romajiFor(jpText);
            if (!romaji) return;
            const div = document.createElement('div');
            div.className = 'jp-romaji';
            div.textContent = romaji;
            firstCol.appendChild(div);
          });
        }
        el = el.nextElementSibling;
      }
    });
  }

  // Inject "Listen to Dialogue" buttons
  if (bodyEl) {
    bodyEl.querySelectorAll('.dialogue').forEach(container => {
      const speeds = [
        { label: '1x', rate: 0.92 },
        { label: '0.75x', rate: 0.75 },
        { label: '1.25x', rate: 1.1 },
      ];
      let speedIdx = 0;
      const wrap = document.createElement('div');
      wrap.className = 'dialogue-controls';
      const playBtn = document.createElement('button');
      playBtn.className = 'dialogue-listen-btn';
      playBtn.textContent = '🔊 Listen';
      const speedBtn = document.createElement('button');
      speedBtn.className = 'dialogue-speed-btn';
      speedBtn.textContent = speeds[0].label;
      speedBtn.title = 'Click to change speed';
      speedBtn.onclick = function() {
        speedIdx = (speedIdx + 1) % speeds.length;
        this.textContent = speeds[speedIdx].label;
      };
      playBtn.onclick = function() {
        if (this.dataset.playing === '1') {
          speechSynthesis.cancel();
          this.textContent = '🔊 Listen';
          this.dataset.playing = '0';
          this.classList.remove('playing');
          return;
        }
        const turns = [];
        container.querySelectorAll('.dialogue-line').forEach(line => {
          const isStaff = line.classList.contains('dialogue-staff');
          const bubble = line.querySelector('.dialogue-bubble');
          if (!bubble) return;
          const t = bubble.textContent.trim();
          if (t) turns.push({ role: isStaff ? 'staff' : 'guest', text: t });
        });
        if (!turns.length) return;
        const cur = speeds[speedIdx];
        const rate = cur.rate;
        this.textContent = '⏹ Stop';
        this.dataset.playing = '1';
        this.classList.add('playing');

        // Show which voices are in use
        const voiceInfo = container.querySelector('.dialogue-voice-info');
        if (voiceInfo) voiceInfo.remove();

        let turnIdx = 0;
        const btn = this;
        function playNextTurn() {
          if (btn.dataset.playing !== '1') return;
          if (turnIdx >= turns.length) {
            btn.textContent = '🔊 Listen';
            btn.dataset.playing = '0';
            btn.classList.remove('playing');
            return;
          }
          const turn = turns[turnIdx++];
          const useSecondary = turn.role === 'guest' && _jaVoiceSecondary;
          const voice = useSecondary ? _jaVoiceSecondary : _jaVoice;
          const pitchOffset = (turn.role === 'guest') ? (useSecondary ? 0.15 : 0.35) : 0;
          const effectiveRate = (turn.role === 'guest' && !useSecondary) ? rate * 0.9 : rate;
          speakJp(turn.text, effectiveRate, voice, pitchOffset);
          const pollTurn = setInterval(() => {
            if (btn.dataset.playing !== '1') { clearInterval(pollTurn); return; }
            if (!speechSynthesis.speaking) {
              clearInterval(pollTurn);
              playNextTurn();
            }
          }, 300);
        }
        playNextTurn();
      };
      wrap.appendChild(playBtn);
      wrap.appendChild(speedBtn);
      // Meaning toggle
      const meaningBtn = document.createElement('button');
      meaningBtn.className = 'dialogue-meaning-btn';
      meaningBtn.textContent = 'Meaning';
      meaningBtn.onclick = function() {
        container.classList.toggle('show-en');
        this.textContent = container.classList.contains('show-en') ? 'Hide Meaning' : 'Meaning';
      };
      wrap.appendChild(meaningBtn);
      container.insertBefore(wrap, container.firstChild);
    });
  }

  // Inject pronunciation widget for vocabulary files
  if (isVocabFile) {
    const m = sectionTitle.match(/^(.+?)\s*\((.+?)\)$/);
    if (m) injectVocabPronWidget(m[1].trim(), m[2].trim());
  }

  // Style example sentences in vocabulary files into blue left-border boxes
  if (isVocabFile && bodyEl) {
    // 1. Handle *Example: text* format (single-paragraph italic-marked examples)
    bodyEl.querySelectorAll('p').forEach(p => {
      const em = p.querySelector('em');
      if (em && /^Example:\s/.test(em.textContent)) {
        p.classList.add('vocab-example-line');
        const rest = em.innerHTML.replace(/^Example:\s*/, '');
        p.innerHTML = '<span class="vocab-example-label">Example</span>' + rest;
      }
    });

    // 2. Handle table format: <table> with Japanese/Meaning header
    bodyEl.querySelectorAll('table').forEach(table => {
      const thead = table.querySelector('thead');
      if (!thead) return;
      const headerText = thead.textContent.trim();
      if (!/Japanese/i.test(headerText) || !/Meaning/i.test(headerText)) return;

      const rows = table.querySelectorAll('tbody tr');
      const fragment = document.createDocumentFragment();
      rows.forEach(tr => {
        const cells = tr.querySelectorAll('td');
        if (cells.length < 2) return;
        const p = document.createElement('p');
        p.className = 'vocab-example-line';
        p.innerHTML = '<span class="vocab-example-label">Example</span> ' +
          cells[0].innerHTML.trim() + '<br>' + cells[1].innerHTML.trim();
        fragment.appendChild(p);
      });
      table.replaceWith(fragment);
    });

    // 3. Handle paragraph format: <p> with <small> (romaji) = example
    bodyEl.querySelectorAll('p').forEach(p => {
      if (p.classList.contains('vocab-example-line')) return;
      if (!p.querySelector('small')) return;
      p.classList.add('vocab-example-line');
      p.innerHTML = '<span class="vocab-example-label">Example</span> ' +
        p.innerHTML
          .replace(/\n<small>/g, '<br><small>')
          .replace(/<\/small>\s*/g, '</small><br>');
    });
  }

}
