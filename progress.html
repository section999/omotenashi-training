<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png" />
  <title>Progress — Omotenashi Training</title>
  <style>
    :root {
      --bg-primary:#0a0a23; --bg-secondary:#1b1b32; --bg-tertiary:#2a2a4a;
      --accent-yellow:#f1be32; --accent-blue:#198eee;
      --accent-green:#1fad69; --accent-red:#c5442a;
      --text-primary:#ffffff; --text-secondary:#a3a3c2; --text-muted:#5f5f7a;
      --text-inverse:#0a0a23; --border-default:#2a2a4a;
      --font-mono:'Cascadia Code','Fira Code','Consolas',monospace;
    }
    [data-theme="light"] {
      --bg-primary:#ffffff; --bg-secondary:#f5f6f7; --bg-tertiary:#eaeaef;
      --text-primary:#1b1b32; --text-secondary:#46465e; --text-muted:#78788a;
      --border-default:#c8c9cc;
    }
    [data-theme="light"] .nav { background:#0a0a23 !important; }
    [data-theme="light"] .nav * { color:#ffffff !important; border-color:transparent !important; }
    [data-theme="light"] .nav-dropdown { background:#1b1b32 !important; border-color:#3b3b5c !important; }
    [data-theme="light"] .nav-dropdown a:hover { background:rgba(255,255,255,0.08) !important; }
    [data-theme="light"] .footer { background:#0a0a23 !important; }
    [data-theme="light"] .footer * { color:#ffffff !important; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { font-size:18px; }
    body { background:var(--bg-secondary); color:var(--text-primary); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }

    /* NAV */
    .nav { position:fixed; top:0; left:0; right:0; z-index:200; height:60px; background:#0a0a23; }
    .nav-inner { max-width:1200px; margin:0 auto; padding:0 32px; height:100%; display:flex; align-items:center; justify-content:space-between; position:relative; }
    @media (max-width:640px) { .nav-inner { padding:0 16px; } }

    /* MAIN */
    .main { max-width:860px; margin:0 auto; padding:96px 32px 80px; }

    .page-title { font-size:1.5rem; font-weight:700; color:var(--accent-yellow); margin-bottom:6px; font-family:var(--font-mono); }
    .page-sub { color:var(--text-secondary); font-size:0.9rem; margin-bottom:36px; }

    /* OVERALL CARD */
    .overall-card {
      background:var(--bg-primary); border:1px solid var(--border-default);
      border-radius:8px; padding:24px 28px; margin-bottom:40px;
      display:flex; align-items:center; gap:24px; flex-wrap:wrap;
    }
    .overall-pct { font-size:2.8rem; font-weight:700; color:var(--accent-yellow); font-family:var(--font-mono); line-height:1; }
    .overall-label { color:var(--text-secondary); font-size:0.85rem; margin-top:4px; }
    .overall-bar-section { flex:1; min-width:200px; }
    .overall-bar-wrap { height:8px; background:var(--bg-tertiary); border-radius:4px; overflow:hidden; margin-bottom:8px; }
    .overall-bar { height:100%; background:var(--accent-green); border-radius:4px; transition:width 0.6s ease; }
    .overall-count { font-size:0.85rem; color:var(--text-muted); }

    /* GROUPS */
    .progress-group { margin-bottom:36px; }
    .group-name {
      font-family:var(--font-mono); font-size:0.75rem; text-transform:uppercase;
      letter-spacing:0.1em; color:var(--text-muted);
      border-bottom:1px solid var(--border-default); padding-bottom:8px; margin-bottom:4px;
      display:flex; justify-content:space-between; align-items:baseline;
    }
    .group-pct { font-size:0.8rem; color:var(--accent-yellow); }
    .lesson-row {
      display:flex; align-items:center; gap:12px;
      padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04);
    }
    [data-theme="light"] .lesson-row { border-bottom-color:rgba(0,0,0,0.06); }
    .lesson-name { flex:1; font-size:0.88rem; color:var(--text-secondary); }
    .lesson-bar-wrap { width:160px; height:5px; background:var(--bg-tertiary); border-radius:3px; overflow:hidden; flex-shrink:0; }
    .lesson-bar { height:100%; background:var(--accent-green); border-radius:3px; }
    .lesson-bar.partial { background:var(--accent-yellow); }
    .lesson-pct { width:38px; text-align:right; font-size:0.8rem; color:var(--text-muted); font-family:var(--font-mono); flex-shrink:0; }
    .lesson-count { width:70px; text-align:right; font-size:0.75rem; color:var(--text-muted); flex-shrink:0; }

    /* EMPTY STATE */
    .empty-state { text-align:center; padding:60px 24px; color:var(--text-muted); }
    .empty-state a { color:var(--accent-blue); text-decoration:none; }

    /* FOOTER */
    .footer { border-top:none; padding:18px 0; margin-top:40px; background:#0a0a23; }
    .footer-inner { max-width:1300px; margin:0 auto; padding:0 32px; display:flex; align-items:center; justify-content:center; position:relative; }
    .footer-brand { font-family:var(--font-mono); font-size:1rem; color:#fff; text-decoration:none; }
    .scroll-top { position:absolute; right:32px; width:36px; height:36px; background:transparent; border:none; border-radius:4px; color:#fff; cursor:pointer; font-size:1.1rem; opacity:0.7; transition:opacity 0.2s; }
    .scroll-top:hover { opacity:1; }

    @media (max-width:640px) {
      .main { padding:80px 16px 60px; }
      .lesson-bar-wrap { width:100px; }
      .lesson-count { display:none; }
    }
  </style>
  <link rel="stylesheet" href="assets/nav.css" />
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-search-wrap">
      <div class="nav-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="navSearchInput" name="navSearch" placeholder="Search phrases..." autocomplete="off" />
      </div>
      <div id="navSearchDrop" class="nav-search-drop"></div>
    </div>
    <a href="index.html" style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;">
      <img src="assets/fcc_primary_large.png" alt="freeCodeCamp" style="height:28px;width:auto;filter:brightness(0) invert(1);" onerror="this.style.display='none'" />
    </a>
    <div style="display:flex;align-items:center;gap:16px;margin-left:auto;">
      <div class="nav-menu-wrap">
        <button class="nav-menu-btn" aria-label="Open menu" onclick="this.nextElementSibling.classList.toggle('open')">
          <span></span><span></span><span></span>
        </button>
        <div class="nav-dropdown">
          <a href="index.html">Main</a>
          <a href="curriculum.html">Curriculum</a>
          <a href="progress.html">Progress</a>
          <a href="calendar.html">Cultural Calendar</a>
          <a href="#" onclick="toggleMode();return false;">Switch Mode</a>
          <a href="https://www.freecodecamp.org/donate/" target="_blank" rel="noopener">Donate</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<main class="main">
  <div class="page-title">Your Progress</div>
  <div class="page-sub">Lessons completed across all modules — saved locally in your browser</div>
  <div class="overall-card" id="overallCard"></div>
  <div id="progressGroups"></div>
</main>

<footer class="footer">
  <div style="max-width:1300px;margin:0 auto;padding:0 32px;">
    <div class="footer-inner">
      <a href="index.html" class="footer-brand">Omotenashi Training</a>
      <button class="scroll-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
    </div>
  </div>
</footer>

<script>
const MODULES = [
  { group: 'The Spirit of Omotenashi', lessons: [
    { id: 'm1-philosophy', name: 'Understanding Japanese Service Spirit', total: 6 },
    { id: 'm1-comms',      name: 'Communication & Etiquette',            total: 5 },
    { id: 'm1-skills',     name: 'Service Skills',                        total: 5 },
    { id: 'm1-fnb',        name: 'Food & Beverage',                       total: 4 },
    { id: 'm1-crisis',     name: 'Crisis Management',                     total: 4 },
  ]},
  { group: 'Practical Service Skills', lessons: [
    { id: 'm2-keigo',         name: 'Keigo — Honorific Language',     total: 5 },
    { id: 'm2-seasons',       name: 'Seasons & Cultural Calendar',    total: 5 },
    { id: 'm2-gift',          name: 'Gift-Giving Etiquette',          total: 5 },
    { id: 'm2-accommodation', name: 'Accommodation Services',         total: 5 },
    { id: 'm2-appearance',    name: 'Professional Appearance',        total: 5 },
    { id: 'm2-teamwork',      name: 'Teamwork & Staff Harmony',       total: 5 },
  ]},
  { group: 'Expert Specialization', lessons: [
    { id: 'm3-vip',           name: 'VIP & High-Profile Guest Handling',   total: 5 },
    { id: 'm3-onsen',         name: 'Onsen & Ryokan Etiquette',            total: 5 },
    { id: 'm3-crosscultural', name: 'Cross-Cultural Communication',        total: 5 },
    { id: 'm3-digital',       name: 'Digital Tools & Modern Hospitality',  total: 5 },
  ]},
  { group: 'Vocabulary & Language Skills', lessons: [
    { id: 'm4-emotions', name: 'Reading Guest Emotions',         total: 6  },
    { id: 'v01-vocab',   name: 'Basic Greetings & Service',      total: 24 },
    { id: 'v02-vocab',   name: 'Front Desk Operations',          total: 30 },
    { id: 'v03-vocab',   name: 'Guest Room Services',            total: 30 },
    { id: 'v04-vocab',   name: 'Housekeeping',                   total: 20 },
    { id: 'v05-vocab',   name: 'Restaurant & F&B Service',       total: 20 },
    { id: 'v06-vocab',   name: 'Guest Requests & Problem Solving', total: 25 },
    { id: 'v07-vocab',   name: 'Essential Vocabulary',           total: 10 },
    { id: 'v08-vocab',   name: 'Directions & Navigation',        total: 40 },
    { id: 'v09-vocab',   name: 'Reservations & Scheduling',      total: 40 },
    { id: 'v10-vocab',   name: 'Payments & Accounting',          total: 40 },
    { id: 'v11-vocab',   name: 'Phone & Communication',          total: 40 },
    { id: 'v12-vocab',   name: 'Safety & Emergency',             total: 30 },
    { id: 'v13-vocab',   name: 'Staff & Operations',             total: 30 },
    { id: 'v14-vocab',   name: 'Tourism and Travel',             total: 30 },
    { id: 'v15-vocab',   name: 'Laundry & Additional Services',  total: 20 },
  ]},
  { group: 'Hospitality Simulator', lessons: [
    { id: 'simulator', name: 'Scenario Practice (100 scenarios)', total: 100, sim: true },
  ]},
  { group: 'Flashcard Practice', lessons: [
    { id: 'fc-all', name: 'All Vocabulary Flashcards (429 cards)', total: 429, fcAll: true },
  ]},
];

const FC_GROUPS = [
  {id:'v01-vocab',t:24},{id:'v02-vocab',t:30},{id:'v03-vocab',t:30},
  {id:'v04-vocab',t:20},{id:'v05-vocab',t:20},{id:'v06-vocab',t:25},
  {id:'v07-vocab',t:10},{id:'v08-vocab',t:40},{id:'v09-vocab',t:40},
  {id:'v10-vocab',t:40},{id:'v11-vocab',t:40},{id:'v12-vocab',t:30},
  {id:'v13-vocab',t:30},{id:'v14-vocab',t:30},{id:'v15-vocab',t:20},
];

function countCompleted(id, total, isSim, isFc, isFcAll) {
  let count = 0;
  if (isSim) {
    for (let i = 1; i <= total; i++) {
      if (localStorage.getItem('omotenashi:simulator:' + i) === '1') count++;
    }
  } else if (isFcAll) {
    FC_GROUPS.forEach(g => {
      for (let i = 1; i <= g.t; i++) {
        const num = String(i).padStart(2, '0');
        if (localStorage.getItem('omotenashi:fc:content/vocabulary/' + g.id + '-' + num + '.md') === 'know') count++;
      }
    });
  } else {
    for (let i = 1; i <= total; i++) {
      if (localStorage.getItem('omotenashi:' + id + ':' + i) === '1') count++;
    }
  }
  return count;
}

function renderProgress() {
  let totalAll = 0, completedAll = 0;

  const groupsHtml = MODULES.map(g => {
    let groupTotal = 0, groupDone = 0;
    const rows = g.lessons.map(l => {
      const done = countCompleted(l.id, l.total, l.sim, l.fc, l.fcAll);
      const pct  = l.total ? Math.round((done / l.total) * 100) : 0;
      groupTotal += l.total;
      groupDone  += done;
      totalAll   += l.total;
      completedAll += done;
      const barClass = pct === 100 ? '' : pct > 0 ? ' partial' : '';
      return `<div class="lesson-row">
        <div class="lesson-name">${l.name}</div>
        <div class="lesson-bar-wrap"><div class="lesson-bar${barClass}" style="width:${pct}%"></div></div>
        <div class="lesson-pct">${pct}%</div>
        <div class="lesson-count">${done} / ${l.total}</div>
      </div>`;
    }).join('');
    const gPct = groupTotal ? Math.round((groupDone / groupTotal) * 100) : 0;
    return `<div class="progress-group">
      <div class="group-name">
        <span>${g.group}</span>
        <span class="group-pct">${gPct}%</span>
      </div>
      ${rows}
    </div>`;
  }).join('');

  document.getElementById('progressGroups').innerHTML = groupsHtml;

  const overallPct = totalAll ? Math.round((completedAll / totalAll) * 100) : 0;
  const barColor = overallPct === 100 ? 'var(--accent-green)' : overallPct > 0 ? 'var(--accent-yellow)' : 'var(--bg-tertiary)';
  document.getElementById('overallCard').innerHTML = `
    <div>
      <div class="overall-pct">${overallPct}%</div>
      <div class="overall-label">Overall Completion</div>
    </div>
    <div class="overall-bar-section">
      <div class="overall-bar-wrap">
        <div class="overall-bar" style="width:${overallPct}%;background:${barColor};"></div>
      </div>
      <div class="overall-count">${completedAll.toLocaleString()} of ${totalAll.toLocaleString()} lessons complete</div>
    </div>`;

  if (completedAll === 0) {
    document.getElementById('progressGroups').innerHTML = `<div class="empty-state">
      <p style="font-size:1rem;margin-bottom:12px;">No lessons completed yet.</p>
      <p><a href="curriculum.html">Start learning →</a></p>
    </div>`;
  }
}

renderProgress();

function toggleMode() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
}
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  document.addEventListener('click', e => {
    document.querySelectorAll('.nav-dropdown.open').forEach(d => {
      if (!d.parentElement.contains(e.target)) d.classList.remove('open');
    });
  });
})();
</script>
<script src="assets/search.js"></script>
<script src="assets/nav.js"></script>
</body>
</html>
