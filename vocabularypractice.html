<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="assets/favicon-32x32.png"/>
  <title>Vocabulary Practice — Omotenashi Training</title>
  <style>
    :root {
      --bg-primary:#0a0a23; --bg-secondary:#1b1b32; --bg-tertiary:#2a2a4a;
      --accent-yellow:#f1be32; --accent-blue:#198eee; --accent-green:#1fad69; --accent-red:#c5442a;
      --text-primary:#ffffff; --text-secondary:#a3a3c2; --text-muted:#5f5f7a;
      --border-default:#2a2a4a; --font-mono:'Cascadia Code','Fira Code','Consolas',monospace;
    }
    [data-theme="light"] {
      --bg-primary:#ffffff; --bg-secondary:#f5f6f7; --bg-tertiary:#eaeaef;
      --text-primary:#1b1b32; --text-secondary:#46465e; --text-muted:#78788a; --border-default:#c8c9cc;
    }
    [data-theme="light"] .nav { background:#0a0a23 !important; }
    [data-theme="light"] .nav * { color:#ffffff !important; }
    [data-theme="light"] .nav-dropdown { background:#1b1b32 !important; border-color:#3b3b5c !important; }
    [data-theme="light"] .footer { background:#0a0a23 !important; }
    [data-theme="light"] .footer * { color:#ffffff !important; }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html { font-size:18px; }
    body { background:var(--bg-secondary); color:var(--text-primary); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; }

    .nav { position:fixed; top:0; left:0; right:0; z-index:200; height:60px; background:#0a0a23; }
    .nav-inner { max-width:100%; padding:0 32px; height:100%; display:flex; align-items:center; justify-content:space-between; position:relative; }
    @media (max-width:640px) { .nav-inner { padding:0 16px; } }

    .main { max-width:660px; margin:0 auto; padding:84px 24px 72px; }

    /* ── SETUP ── */
    .setup-title { font-family:var(--font-mono); font-size:1.4rem; font-weight:700; color:var(--accent-yellow); margin:64px 0 28px; text-align:center; }
    .setup-sub { font-size:0.82rem; color:var(--text-muted); margin-bottom:24px; }
    .setup-card { background:var(--bg-primary); border:1px solid var(--border-default); border-radius:10px; padding:24px 28px; margin-bottom:16px; }
    .setup-row { margin-bottom:18px; }
    .setup-label { display:block; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:7px; font-family:var(--font-mono); }
    .setup-select { width:100%; background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-default); border-radius:5px; padding:9px 12px; font-size:0.85rem; cursor:pointer; }
    .tog-group { display:flex; gap:8px; }
    .tog-btn { flex:1; padding:9px 10px; border-radius:5px; border:1px solid var(--border-default); background:transparent; color:var(--text-secondary); font-size:0.83rem; cursor:pointer; transition:all 0.15s; }
    .tog-btn.active { background:var(--accent-yellow); color:#0a0a23; border-color:var(--accent-yellow); font-weight:700; }
    .setup-divider { border-top:1px solid var(--border-default); margin:18px 0; }
    .setup-check-col { display:flex; flex-direction:column; gap:14px; }
    .setup-check-label { display:flex; align-items:flex-start; gap:11px; cursor:pointer; }
    .setup-check-label input[type="checkbox"] { margin-top:3px; flex-shrink:0; accent-color:var(--accent-green); width:15px; height:15px; cursor:pointer; }
    .setup-check-text { display:flex; flex-direction:column; gap:2px; }
    .setup-check-text strong { font-size:0.86rem; }
    .setup-check-sub { font-size:0.74rem; color:var(--text-muted); line-height:1.4; }
    .setup-start { width:100%; margin-top:22px; padding:13px; background:var(--accent-yellow); color:#0a0a23; border:none; border-radius:6px; font-size:0.95rem; font-weight:700; cursor:pointer; transition:opacity 0.15s; }
    .setup-start:hover { opacity:0.85; }
    .setup-stats { font-size:0.8rem; color:var(--text-muted); text-align:center; }
    .setup-stats strong { color:var(--accent-green); }

    /* ── CARD SCREEN ── */
    .cs-topbar { display:flex; align-items:center; gap:10px; margin-top:40px; margin-bottom:24px; }
    .cs-back { padding:6px 13px; background:transparent; border:1px solid var(--border-default); border-radius:4px; color:var(--text-secondary); font-size:0.8rem; cursor:pointer; white-space:nowrap; }
    .cs-back:hover { background:var(--bg-tertiary); color:var(--text-primary); }
    .cs-round { font-family:var(--font-mono); font-size:0.76rem; color:var(--text-muted); white-space:nowrap; }
    .cs-group-sel { margin-left:auto; background:var(--bg-tertiary); border:1px solid var(--border-default); border-radius:4px; color:var(--text-secondary); font-size:0.76rem; padding:5px 8px; cursor:pointer; max-width:190px; }

    .cs-prog-wrap { height:5px; background:var(--bg-tertiary); border-radius:3px; overflow:hidden; margin-bottom:6px; }
    .cs-prog-bar { height:100%; background:var(--accent-green); border-radius:3px; transition:width 0.4s; }
    .cs-prog-label { font-size:0.74rem; color:var(--text-muted); font-family:var(--font-mono); text-align:right; margin-bottom:16px; }

    .cs-card { background:var(--bg-primary); border:1px solid var(--border-default); border-radius:10px; height:400px; width:100%; cursor:pointer; padding:48px 40px; margin-bottom:28px; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; transition:border-color 0.2s; user-select:none; }
    .cs-card.flipped { user-select:text; cursor:default; }
    .cs-card.flipped .cs-face-back { user-select:text; }
    .cs-card:hover { border-color:rgba(25,142,238,0.3); }
    .cs-card.flipped { border-color:rgba(25,142,238,0.22); background:rgba(25,142,238,0.03); }
    .cs-flip-icon { position:absolute; top:10px; right:13px; font-size:0.7rem; color:var(--text-muted); opacity:0.45; pointer-events:none; }
    .cs-face { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; width:100%; height:100%; overflow-y:auto; transition:opacity 0.13s; }
    .cs-face-back { display:none; opacity:0; }

    .cs-jp { font-size:2.6rem; font-weight:700; color:var(--accent-yellow); }
    .cs-romaji { font-size:1rem; color:var(--text-muted); font-family:var(--font-mono); }
    .cs-flip-hint { font-size:0.82rem; color:var(--text-muted); margin-top:6px; }
    .cs-def { font-size:1.05rem; color:var(--text-primary); line-height:1.7; max-width:520px; }
    .cs-jp-sm { font-size:2rem; font-weight:700; color:var(--accent-yellow); }
    .cs-romaji-sm { font-size:0.95rem; color:var(--text-muted); font-family:var(--font-mono); }
    .cs-en-prompt { font-size:0.82rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); }
    .cs-def-front { font-size:1.08rem; color:var(--text-primary); line-height:1.65; max-width:520px; font-style:italic; }
    .cs-def-sm { font-size:0.92rem; color:var(--text-secondary); margin-top:4px; max-width:480px; line-height:1.55; }

    .cs-actions { display:flex; gap:10px; width:100%; margin-bottom:10px; justify-content:center; }
    .cs-btn { width:160px; padding:11px; border-radius:6px; font-size:0.88rem; font-weight:600; cursor:pointer; transition:opacity 0.15s; border:1px solid transparent; }
    .cs-btn:disabled { opacity:0.28; cursor:not-allowed; }
    .cs-know { background:var(--accent-green); color:#fff; border-color:var(--accent-green); }
    .cs-know:hover:not(:disabled) { opacity:0.85; }
    .cs-learning { background:var(--accent-yellow); color:#0a0a23; border-color:var(--accent-yellow); }
    .cs-learning:hover:not(:disabled) { opacity:0.85; }
    .cs-status { font-size:0.76rem; color:var(--text-muted); text-align:center; min-height:1.1em; margin-bottom:6px; }
    .cs-adv-bar { height:3px; border-radius:2px; overflow:hidden; margin-bottom:10px; background:transparent; }
    .adv-prog { height:100%; background:var(--accent-green); border-radius:2px; }

    .cs-nav { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .cs-nav-btn { padding:10px 18px; min-height:44px; border-radius:5px; border:1px solid var(--border-default); background:transparent; color:var(--text-secondary); font-size:0.83rem; cursor:pointer; }
    .cs-nav-btn:hover:not(:disabled) { background:var(--bg-tertiary); color:var(--text-primary); }
    .cs-nav-btn:disabled { opacity:0.25; cursor:default; }
    .cs-counter { font-family:var(--font-mono); font-size:0.8rem; color:var(--text-muted); }

    .cs-speak-btn { background:transparent; border:1px solid var(--border-default); border-radius:4px; color:var(--text-muted); font-size:0.88rem; padding:3px 7px; cursor:pointer; line-height:1; margin-top:4px; transition:background 0.12s, color 0.12s; }
    .cs-speak-btn:hover { background:var(--bg-tertiary); color:var(--text-primary); }

    .cs-swipe-hint { font-size:0.7rem; color:var(--text-muted); text-align:center; margin-top:16px; display:none; }
    @media (pointer:coarse) { .cs-swipe-hint { display:block; } }
    .cs-kbd { font-size:0.7rem; color:var(--text-muted); text-align:center; margin-top:28px; line-height:1.9; }
    @media (pointer:coarse) { .cs-kbd { display:none; } }
    .key { display:inline-block; background:var(--bg-tertiary); border:1px solid var(--border-default); border-radius:3px; padding:1px 5px; font-family:var(--font-mono); font-size:0.68rem; }

    /* ── DICTATION ── */
    .dict-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; padding:10px 0; }
    .dict-play-btn { width:72px; height:72px; border-radius:50%; background:var(--bg-tertiary); border:2px solid var(--accent-yellow); color:var(--accent-yellow); font-size:1.8rem; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .dict-play-btn:hover { background:rgba(241,190,50,0.1); transform:scale(1.05); }
    .dict-play-btn.playing { animation:dict-pulse 0.8s ease-in-out infinite; }
    @keyframes dict-pulse { 0%,100% { box-shadow:0 0 0 0 rgba(241,190,50,0.4); } 50% { box-shadow:0 0 0 14px rgba(241,190,50,0); } }
    .dict-hint { font-size:0.82rem; color:var(--text-muted); }
    .dict-input { width:100%; max-width:380px; padding:10px 14px; border-radius:6px; border:1px solid var(--border-default); background:var(--bg-tertiary); color:var(--text-primary); font-size:1.2rem; text-align:center; outline:none; font-family:inherit; }
    .dict-input:focus { border-color:var(--accent-blue); }
    .dict-input:disabled { opacity:0.5; }
    .dict-result { font-size:0.92rem; line-height:1.6; text-align:center; min-height:2.5em; }
    .dict-result .answer { font-size:1.4rem; font-weight:700; color:var(--accent-yellow); margin-top:6px; }
    .dict-actions { display:flex; gap:10px; justify-content:center; margin-bottom:10px; }
    .dict-btn { padding:9px 24px; border-radius:6px; font-size:0.9rem; font-weight:600; cursor:pointer; transition:opacity 0.15s; font-family:inherit; }
    .dict-btn:disabled { opacity:0.3; cursor:default; }
    .dict-btn-check { background:var(--accent-blue); color:#fff; border:1px solid var(--accent-blue); }
    .dict-btn-check:hover:not(:disabled) { opacity:0.85; }
    .dict-btn-skip { background:transparent; color:var(--text-secondary); border:1px solid var(--border-default); }
    .dict-btn-skip:hover:not(:disabled) { background:var(--bg-tertiary); color:var(--text-primary); }

    /* ── COMPLETE ── */
    .complete-wrap { text-align:center; padding:12px 0; }
    .complete-icon { font-size:2.4rem; margin-bottom:10px; }
    .complete-title { font-family:var(--font-mono); font-size:1.15rem; font-weight:700; color:var(--accent-yellow); margin-bottom:4px; }
    .complete-sub { font-size:0.82rem; color:var(--text-muted); margin-bottom:26px; }
    .complete-stats { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; margin-bottom:28px; }
    .c-stat { display:flex; flex-direction:column; align-items:center; gap:3px; }
    .c-stat-n { font-size:2rem; font-weight:700; font-family:var(--font-mono); }
    .c-stat-l { font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); }
    .c-know { color:var(--accent-green); }
    .c-learning { color:var(--accent-yellow); }
    .complete-btns { display:flex; flex-direction:column; gap:9px; max-width:320px; margin:0 auto; }
    .c-btn-primary { padding:12px; background:var(--accent-yellow); color:#0a0a23; border:none; border-radius:6px; font-size:0.88rem; font-weight:700; cursor:pointer; }
    .c-btn-primary:hover { opacity:0.85; }
    .c-btn-sec { padding:11px; background:transparent; color:var(--text-secondary); border:1px solid var(--border-default); border-radius:6px; font-size:0.85rem; cursor:pointer; }
    .c-btn-sec:hover { background:var(--bg-tertiary); color:var(--text-primary); }

    /* FOOTER */
    .footer { border-top:none; padding:18px 0; margin-top:0; background:#0a0a23; position:fixed; bottom:0; left:0; right:0; z-index:100; }
    .footer-inner { max-width:1300px; margin:0 auto; padding:0 32px; display:flex; align-items:center; justify-content:center; position:relative; }
    .footer-brand { font-family:var(--font-mono); font-size:1rem; color:#fff; text-decoration:none; }
    .scroll-top { position:absolute; right:32px; width:36px; height:36px; background:transparent; border:none; border-radius:4px; color:#fff; cursor:pointer; font-size:1.1rem; opacity:0.7; }
    .scroll-top:hover { opacity:1; }

    @media (max-width:500px) {
      .main { padding:76px 14px 68px; }
      .setup-title { margin:28px 0 20px; }
      .complete-wrap { padding-top:28px; }
      .cs-topbar { margin-top:10px; margin-bottom:16px; }
      .cs-card { height:320px; padding:28px 20px; margin-bottom:20px; }
      .cs-jp { font-size:1.8rem; }
      .cs-jp-sm { font-size:1.4rem; }
      .cs-romaji { font-size:0.85rem; }
      .cs-def { font-size:0.9rem; }
      .cs-def-front { font-size:0.92rem; }
      .cs-def-sm { font-size:0.8rem; }
      .cs-btn { flex:1; width:auto; min-height:44px; }
      .cs-group-sel { display:none; }
      .cs-speak-btn { padding:10px 14px; font-size:1rem; min-width:44px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
      .cs-swipe-hint { margin-top:10px; }
    }

    @media (max-height:500px) and (orientation:landscape) {
      .cs-card { height:200px; padding:20px 24px; margin-bottom:12px; }
      .cs-topbar { margin-top:6px; margin-bottom:10px; }
      .cs-jp { font-size:1.5rem; }
      .cs-def { font-size:0.85rem; }
      .cs-actions { margin-bottom:8px; }
    }
  </style>
  <link rel="stylesheet" href="assets/nav.css"/>
</head>

<div id="signin-modal" style="display:none;position:fixed;inset:0;z-index:900;background:rgba(0,0,0,0.65);align-items:center;justify-content:center;">

      onkeydown="if(event.key==='Enter')submitSignIn()" />

    <hr style="border:none;border-top:1px solid var(--border-default);margin:20px 0;" />

      <button onclick="exportProgress()" style="flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:6px;padding:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
        Export Progress
      </button>
      <button onclick="importProgress()" style="flex:1;background:transparent;color:var(--text-secondary);border:1px solid var(--border-default);border-radius:6px;padding:8px;font-size:0.82rem;font-weight:600;cursor:pointer;">
        Import Progress
      </button>
    </div>

</div>

<script>
// ── CONSTANTS ────────────────────────────────────────────────────────────────
const VOCAB_GROUPS = [
  { id:'v01-vocab', name:'Basic Greetings & Service',        total:24 },
  { id:'v02-vocab', name:'Front Desk Operations',            total:30 },
  { id:'v03-vocab', name:'Guest Room Services',              total:30 },
  { id:'v04-vocab', name:'Housekeeping',                     total:20 },
  { id:'v05-vocab', name:'Restaurant & F&B Service',         total:20 },
  { id:'v06-vocab', name:'Guest Requests & Problem Solving', total:25 },
  { id:'v07-vocab', name:'Essential Vocabulary',             total:10 },
  { id:'v08-vocab', name:'Directions & Navigation',          total:40 },
  { id:'v09-vocab', name:'Reservations & Scheduling',        total:40 },
  { id:'v10-vocab', name:'Payments & Accounting',            total:40 },
  { id:'v11-vocab', name:'Phone & Communication',            total:40 },
  { id:'v12-vocab', name:'Safety & Emergency',               total:30 },
  { id:'v13-vocab', name:'Staff & Operations',               total:30 },
  { id:'v14-vocab', name:'Tourism and Travel',               total:30 },
  { id:'v15-vocab', name:'Laundry & Additional Services',    total:20 },
];

function buildGroupFiles(id) {
  const g = VOCAB_GROUPS.find(x => x.id === id);
  if (!g) return [];
  const out = [];
  for (let i = 1; i <= g.total; i++)
    out.push('content/vocabulary/' + id + '-' + String(i).padStart(2,'0') + '.md');
  return out;
}

const ALL_FILES = VOCAB_GROUPS.flatMap(g => buildGroupFiles(g.id)); // 429

const _h = location.hostname;
const BASE = (_h==='127.0.0.1'||_h==='localhost'||_h==='::1') ? '/' : '/omotenashi-training/';

// ── HELPERS ──────────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fcKey(f) { return 'omotenashi:fc:' + f; }
function getStatus(f) { return localStorage.getItem(fcKey(f)); }
function setStatus(f, s) {
  localStorage.setItem(fcKey(f), s);
  if (s === 'know') {
    const m = f.match(/\/([^/]+)-(\d+)\.md$/);
    if (m) localStorage.setItem('omotenashi:' + m[1] + ':' + parseInt(m[2], 10), '1');
  }
}
function allKnownCount() { return ALL_FILES.filter(f => getStatus(f) === 'know').length; }

function parseFM(text) {
  const fm = {};
  const m = text.match(/^---\n([\s\S]*?)\n---/);
  if (m) m[1].split('\n').forEach(l => { const c = l.indexOf(':'); if (c>-1) fm[l.slice(0,c).trim()] = l.slice(c+1).trim(); });
  return fm;
}
function parseVocabMD(text) {
  const fm = parseFM(text);
  const title = fm.title || '';
  const tm = title.match(/^(.+?)\s*\((.+?)\)$/);
  const jp = tm ? tm[1].trim() : title;
  const romaji = tm ? tm[2].trim() : '';
  const body = text.replace(/^---\n[\s\S]*?\n---\n?/, '').trim();
  const paras = body.split(/\n\n+/).map(p => p.trim()).filter(Boolean);
  const filtered = paras.filter(p => p !== '---' && !/^##/.test(p) && !/^\*\*(Correct|Explanation|Quiz)/.test(p));
  let definition = '';
  if (filtered.length >= 2 && /^\*\*Meaning:\*\*/i.test(filtered[0])) {
    definition = filtered[1]; // v12-style: **Meaning:** label → use next paragraph
  } else {
    definition = filtered[0] || ''; // v01-v11 style: first real paragraph IS the definition
  }
  definition = definition.replace(/^#+\s*/, '').replace(/^\*\*Meaning:\*\*\s*/i, '').replace(/"/g, '');
  return { jp, romaji, definition };
}

// ── CACHE ────────────────────────────────────────────────────────────────────
const cardCache = {};
function fetchCard(file) {
  if (cardCache[file]) return Promise.resolve(cardCache[file]);
  return fetch(BASE + file)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => { cardCache[file] = parseVocabMD(text); return cardCache[file]; });
}
function prefetch(file) { if (file && !cardCache[file]) fetchCard(file).catch(()=>{}); }

// ── TTS ───────────────────────────────────────────────────────────────────────
let currentJP = '';

function getBestJapaneseVoice() {
  const voices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'));
  if (!voices.length) return null;
  // Priority: Neural/Online cloud voices > Microsoft/Google > any remote > local fallback
  const rank = v => {
    const n = v.name.toLowerCase();
    if (n.includes('neural') || n.includes('online')) return 5;
    if (n.includes('microsoft') && !v.localService)   return 4;
    if (n.includes('google') && !v.localService)       return 3;
    if (!v.localService)                               return 2;
    return 1;
  };
  return voices.sort((a, b) => rank(b) - rank(a))[0];
}

function speakCurrentJP(e) {
  if (e) e.stopPropagation();
  if (!currentJP || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(currentJP);
  utt.lang = 'ja-JP';
  utt.rate = 0.9;   // slightly slower for clarity
  const voice = getBestJapaneseVoice();
  if (voice) utt.voice = voice;
  speechSynthesis.speak(utt);
}

// ── SWIPE ────────────────────────────────────────────────────────────────────
let _tx = 0, _ty = 0, _swipeDone = false;
document.addEventListener('touchstart', e => { _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; _swipeDone = false; }, { passive:true });
document.addEventListener('touchend', e => {
  if (!session) return;
  const dx = e.changedTouches[0].clientX - _tx;
  const dy = e.changedTouches[0].clientY - _ty;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    _swipeDone = true;
    markCard(dx > 0 ? 'know' : 'learning');
  }
}, { passive:true });

// ── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA') return;
  if (!session) return;
  const isDict = session.settings.mode === 'dictation';
  if (isDict) {
    if (e.key==='ArrowRight') goNext();
    else if (e.key==='ArrowLeft') goPrev();
    else if (e.key==='k'||e.key==='K') markCard('know');
    else if (e.key==='l'||e.key==='L') markCard('learning');
    else if (e.key==='s'||e.key==='S') playDictation();
    return;
  }
  if (e.key===' '||e.code==='Space') { e.preventDefault(); flipCard(); }
  else if (e.key==='ArrowRight') goNext();
  else if (e.key==='ArrowLeft') goPrev();
  else if (e.key==='k'||e.key==='K') markCard('know');
  else if (e.key==='l'||e.key==='L') markCard('learning');
  else if (e.key==='s'||e.key==='S') speakCurrentJP();
});

// ── SESSION ───────────────────────────────────────────────────────────────────
function startSession() {
  const group = document.getElementById('setupGroup').value;
  const studySession = document.getElementById('setupStudySession').checked;
  const autoAdv = document.getElementById('setupAutoAdv').checked;
  const files = group === 'all' ? [...ALL_FILES] : buildGroupFiles(group);
  session = {
    roundFiles: [], queueIdx: 0, round: 1,
    settings: { direction: setupDir, shuffle: setupOrder==='shuffle', autoAdvance: autoAdv, studySession, groupFilter: group, mode: setupMode }
  };
  showCardScreen();
  startRound(files, 1);
}

function startRound(files, roundNum) {
  const arr = [...files];
  if (session.settings.shuffle) shuffle(arr);
  session.roundFiles = arr;
  session.queueIdx = 0;
  session.round = roundNum;
  const rl = document.getElementById('csRoundLabel');
  if (rl) rl.textContent = 'Round ' + roundNum;
  if (arr.length > 0) loadCard(arr[0]); else endRound();
}

function changeGroup(val) {
  session.settings.groupFilter = val;
  const files = val === 'all' ? [...ALL_FILES] : buildGroupFiles(val);
  showCardScreen();
  session.settings.groupFilter = val;
  startRound(files, 1);
}

// ── CARD LOAD + RENDER ────────────────────────────────────────────────────────
function loadCard(file) {
  clearAutoAdv();
  fetchCard(file)
    .then(data => updateCard(file, data))
    .catch(err => {
      const front = document.getElementById('csFront');
      if (front) front.innerHTML = '<div style="color:var(--accent-red);font-size:0.82rem;">Failed to load.<br>' + escHtml(err.message) + '</div>';
    });
}

function updateCard(file, data) {
  if (session && session.settings.mode === 'dictation') {
    return updateDictationCard(file, data);
  }
  isFlipped = false;
  const card = document.getElementById('csCard');
  if (!card) return;
  card.classList.remove('flipped');

  const front = document.getElementById('csFront');
  const back  = document.getElementById('csBack');
  if (!front || !back) return;

  front.style.display = 'flex'; front.style.opacity = '1';
  back.style.display = 'none';  back.style.opacity = '0';

  currentJP = data.jp;
  const speakBtn = '<button class="cs-speak-btn" onclick="speakCurrentJP(event)" title="Play pronunciation">🔊</button>';

  const dir = session.settings.direction;
  if (dir === 'jp-en') {
    front.innerHTML =
      '<div class="cs-jp">' + escHtml(data.jp) + '</div>' +
      '<div class="cs-romaji">' + escHtml(data.romaji) + '</div>' +
      speakBtn +
      '<div class="cs-flip-hint">↩ tap to reveal meaning</div>';
    back.innerHTML =
      '<div class="cs-def">' + escHtml(data.definition) + '</div>';
  } else {
    front.innerHTML =
      '<div class="cs-en-prompt">What is the Japanese word for:</div>' +
      '<div class="cs-def-front">&ldquo;' + escHtml(data.definition) + '&rdquo;</div>' +
      '<div class="cs-flip-hint">↩ tap to reveal</div>';
    back.innerHTML =
      '<div class="cs-jp">' + escHtml(data.jp) + '</div>' +
      '<div class="cs-romaji">' + escHtml(data.romaji) + '</div>' +
      speakBtn +
      '<div class="cs-def-sm">' + escHtml(data.definition) + '</div>';
  }

  const know = document.getElementById('csKnow');
  const learning = document.getElementById('csLearning');
  if (know) know.disabled = false;
  if (learning) learning.disabled = false;

  // Status
  const saved = getStatus(file);
  const statusEl = document.getElementById('csStatus');
  if (statusEl) {
    if (saved === 'know') statusEl.innerHTML = '<span style="color:var(--accent-green)">✓ Previously known</span> — flip to re-evaluate';
    else if (saved === 'learning') statusEl.innerHTML = '<span style="color:var(--accent-yellow)">△ Still learning</span> — flip to re-evaluate';
    else statusEl.textContent = '';
  }

  // Counter & nav
  const total = session.roundFiles.length;
  const cur = session.queueIdx + 1;
  const counterEl = document.getElementById('csCounter');
  if (counterEl) counterEl.textContent = cur + ' / ' + total;
  const prev = document.getElementById('csNavPrev');
  const next = document.getElementById('csNavNext');
  if (prev) prev.disabled = session.queueIdx <= 0;
  if (next) next.textContent = session.queueIdx >= total - 1 ? 'Finish →' : 'Next →';

  updateProgressBar();
  prefetch(session.roundFiles[session.queueIdx + 1]);
}

// ── DICTATION ────────────────────────────────────────────────────────────────
function updateDictationCard(file, data) {
  currentCardData = data;
  currentJP = data.jp;
  speechSynthesis.cancel();
  const front = document.getElementById('csFront');
  if (!front) return;
  front.style.display = 'flex';
  front.style.opacity = '1';

  const hint = document.getElementById('dictHint');
  const romajiEl = document.getElementById('dictRomaji');
  const input = document.getElementById('dictInput');
  const result = document.getElementById('dictResult');
  const checkBtn = document.getElementById('dictCheckBtn');
  const skipBtn = document.getElementById('dictSkipBtn');

  if (hint) hint.textContent = 'Listen and type what you hear';
  if (romajiEl) { romajiEl.textContent = data.romaji; romajiEl.style.display = 'none'; }
  if (input) { input.value = ''; input.disabled = false; input.focus(); }
  if (result) result.innerHTML = '';
  if (checkBtn) checkBtn.disabled = false;
  if (skipBtn) skipBtn.disabled = false;

  // Hide know/learning until check
  const actions = document.getElementById('csActions');
  if (actions) actions.style.display = 'none';
  const know = document.getElementById('csKnow');
  const learning = document.getElementById('csLearning');
  if (know) know.disabled = true;
  if (learning) learning.disabled = true;

  // Status
  const statusEl = document.getElementById('csStatus');
  const saved = getStatus(file);
  if (statusEl) {
    if (saved === 'know') statusEl.innerHTML = '<span style="color:var(--accent-green)">✓ Previously known</span>';
    else if (saved === 'learning') statusEl.innerHTML = '<span style="color:var(--accent-yellow)">△ Previously marked learning</span>';
    else statusEl.textContent = '';
  }

  // Counter & nav
  const total = session.roundFiles.length;
  const cur = session.queueIdx + 1;
  const counterEl = document.getElementById('csCounter');
  if (counterEl) counterEl.textContent = cur + ' / ' + total;
  const prev = document.getElementById('csNavPrev');
  const next = document.getElementById('csNavNext');
  if (prev) prev.disabled = session.queueIdx <= 0;
  if (next) next.textContent = session.queueIdx >= total - 1 ? 'Finish →' : 'Next →';

  updateProgressBar();
  prefetch(session.roundFiles[session.queueIdx + 1]);


}

function playDictation() {
  if (!currentJP) return;
  speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(currentJP);
  utt.lang = 'ja-JP';
  utt.rate = 0.85;
  const voice = getBestJapaneseVoice();
  if (voice) utt.voice = voice;
  const btn = document.getElementById('dictPlayBtn');
  if (btn) btn.classList.add('playing');
  utt.onend = function () { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.speak(utt);
}

function checkDictation() {
  const input = document.getElementById('dictInput');
  const result = document.getElementById('dictResult');
  const data = currentCardData;
  if (!input || !result || !data) return;

  const userAns = input.value.trim();
  if (!userAns) {
    result.innerHTML = '<span style="color:var(--text-muted)">Type your answer first.</span>';
    return;
  }

  const normUser = userAns.replace(/\s+/g, '');
  const normCorrect = data.jp.replace(/\s+/g, '');
  const isCorrect = normUser === normCorrect;

  if (isCorrect) {
    result.innerHTML =
      '<div style="color:var(--accent-green);font-size:1.05rem;">✓ Correct!</div>' +
      '<div class="answer">' + escHtml(data.jp) + '</div>';
  } else {
    result.innerHTML =
      '<div style="color:var(--accent-red);font-size:1.05rem;">✗ Not quite</div>' +
      '<div class="answer">' + escHtml(data.jp) + '</div>' +
      '<div class="dict-romaji" style="margin-top:6px;display:block;">' + escHtml(data.romaji) + '</div>' +
      '<div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px;">You typed: ' + escHtml(userAns) + '</div>';
  }

  input.disabled = true;
  const checkBtn = document.getElementById('dictCheckBtn');
  const skipBtn = document.getElementById('dictSkipBtn');
  if (checkBtn) checkBtn.disabled = true;
  if (skipBtn) skipBtn.disabled = true;

  const romajiEl = document.getElementById('dictRomaji');
  if (romajiEl) romajiEl.style.display = 'block';

  const actions = document.getElementById('csActions');
  if (actions) actions.style.display = 'flex';
  const know = document.getElementById('csKnow');
  const learning = document.getElementById('csLearning');
  if (know) know.disabled = false;
  if (learning) learning.disabled = false;
  if (data) {
    const def = data.definition || '';
    const statusEl = document.getElementById('csStatus');
    if (statusEl) statusEl.innerHTML = '<span style="color:var(--text-secondary);font-size:0.82rem;">' + escHtml(def) + '</span>';
  }
}

function skipDictation() {
  const data = currentCardData;
  if (!data) return;

  const result = document.getElementById('dictResult');
  if (result) {
    result.innerHTML =
      '<div style="color:var(--text-muted);font-size:1.05rem;">Answer</div>' +
      '<div class="answer">' + escHtml(data.jp) + '</div>' +
      '<div class="dict-romaji" style="margin-top:6px;display:block;">' + escHtml(data.romaji) + '</div>';
  }

  const input = document.getElementById('dictInput');
  if (input) input.disabled = true;
  const checkBtn = document.getElementById('dictCheckBtn');
  const skipBtn = document.getElementById('dictSkipBtn');
  if (checkBtn) checkBtn.disabled = true;
  if (skipBtn) skipBtn.disabled = true;

  const romajiEl = document.getElementById('dictRomaji');
  if (romajiEl) romajiEl.style.display = 'block';

  const actions = document.getElementById('csActions');
  if (actions) actions.style.display = 'flex';
  const know = document.getElementById('csKnow');
  const learning = document.getElementById('csLearning');
  if (know) know.disabled = false;
  if (learning) learning.disabled = false;

  const statusEl = document.getElementById('csStatus');
  if (statusEl && data.definition) statusEl.innerHTML = '<span style="color:var(--text-secondary);font-size:0.82rem;">' + escHtml(data.definition) + '</span>';
}

// ── FLIP ─────────────────────────────────────────────────────────────────────
function flipCard() {
  const front = document.getElementById('csFront');
  const back  = document.getElementById('csBack');
  const card  = document.getElementById('csCard');
  if (!front || !back || !card) return;

  isFlipped = !isFlipped;
  card.classList.toggle('flipped', isFlipped);

  if (isFlipped) {
    front.style.opacity = '0';
    setTimeout(() => {
      front.style.display = 'none';
      back.style.display = 'flex';
      back.style.opacity = '0';
      requestAnimationFrame(() => { back.style.transition = 'opacity 0.13s'; back.style.opacity = '1'; });
    }, 110);
    const know = document.getElementById('csKnow');
    const learning = document.getElementById('csLearning');
    if (know) know.disabled = false;
    if (learning) learning.disabled = false;
    const statusEl = document.getElementById('csStatus');
    const file = session.roundFiles[session.queueIdx];
    if (statusEl && !getStatus(file)) statusEl.textContent = '';
  } else {
    back.style.opacity = '0';
    setTimeout(() => {
      back.style.display = 'none';
      front.style.display = 'flex';
      front.style.opacity = '0';
      requestAnimationFrame(() => { front.style.transition = 'opacity 0.13s'; front.style.opacity = '1'; });
    }, 110);
    const know = document.getElementById('csKnow');
    const learning = document.getElementById('csLearning');
    if (know) know.disabled = true;
    if (learning) learning.disabled = true;
  }
}

function cardClick() {
  if (_swipeDone) { _swipeDone = false; return; }
  flipCard();
}

// ── MARK ─────────────────────────────────────────────────────────────────────
function markCard(status) {
  if (!session) return;
  const file = session.roundFiles[session.queueIdx];
  if (!file) return;
  setStatus(file, status);
  updateProgressBar();
  if (session.settings.mode === 'dictation') {
    // In dictation mode, always advance immediately
    goNext();
    return;
  }
  if (isFlipped) {
    // Card was flipped — advance immediately
    goNext();
  } else {
    // Card not flipped — just mark, stay on card
    const statusEl = document.getElementById('csStatus');
    if (statusEl) statusEl.innerHTML = status === 'know'
      ? '<span style="color:var(--accent-green)">✓ Marked as known</span>'
      : '<span style="color:var(--accent-yellow)">△ Still learning</span>';
    if (session.settings.autoAdvance) startAutoAdv();
  }
}

// ── NAVIGATE ─────────────────────────────────────────────────────────────────
function goNext() {
  clearAutoAdv();
  if (session.queueIdx >= session.roundFiles.length - 1) { endRound(); return; }
  session.queueIdx++;
  loadCard(session.roundFiles[session.queueIdx]);
}
function goPrev() {
  clearAutoAdv();
  if (session.queueIdx <= 0) return;
  session.queueIdx--;
  loadCard(session.roundFiles[session.queueIdx]);
}

function endRound() { showCompleteScreen(); }

function updateProgressBar() {
  const files = session.roundFiles;
  if (!files.length) return;
  const known = files.filter(f => getStatus(f) === 'know').length;
  const pct = Math.round((known / files.length) * 100);
  const bar = document.getElementById('csPBar');
  const lbl = document.getElementById('csPLabel');
  if (bar) bar.style.width = pct + '%';
  if (lbl) lbl.textContent = known + ' / ' + files.length + ' known';
}

// ── AUTO-ADVANCE ─────────────────────────────────────────────────────────────
function startAutoAdv() {
  clearAutoAdv();
  const bar = document.getElementById('csAdvBar');
  if (bar) {
    bar.innerHTML = '<div class="adv-prog" id="advProg" style="width:0%;transition:none;"></div>';
    requestAnimationFrame(() => {
      const p = document.getElementById('advProg');
      if (p) { p.style.transition = 'width 0.8s linear'; p.style.width = '100%'; }
    });
  }
  autoAdvTimer = setTimeout(goNext, 800);
}
function clearAutoAdv() {
  if (autoAdvTimer) { clearTimeout(autoAdvTimer); autoAdvTimer = null; }
  const bar = document.getElementById('csAdvBar');
  if (bar) bar.innerHTML = '';
}

// ── SCREEN: COMPLETE ──────────────────────────────────────────────────────────
function showCompleteScreen() {
  const files = session.roundFiles;
  const know     = files.filter(f => getStatus(f) === 'know').length;
  const learning = files.filter(f => getStatus(f) === 'learning').length;
  const unseen   = files.filter(f => !getStatus(f)).length;
  const learningFiles = files.filter(f => getStatus(f) === 'learning');
  const allKnown = learningFiles.length === 0 && unseen === 0;

  const studyAgainBtn = (session.settings.studySession && learningFiles.length > 0)
    ? '<button class="c-btn-primary" onclick="doStudyLearning()">Study &ldquo;Still learning&rdquo; again (' + learningFiles.length + ' cards) →</button>'
    : (allKnown ? '<div style="color:var(--accent-green);font-weight:600;margin-bottom:8px;">All cards known! 🎉</div>' : '');

  document.getElementById('mainContent').innerHTML =
    '<div class="complete-wrap">' +
      '<div class="complete-icon">' + (allKnown ? '🎉' : '✓') + '</div>' +
      '<div class="complete-title">Round ' + session.round + ' Complete!</div>' +
      '<div class="complete-sub">' + files.length + ' cards reviewed' + (session.round > 1 ? ' · Round ' + session.round : '') + '</div>' +
      '<div class="complete-stats">' +
        '<div class="c-stat"><div class="c-stat-n c-know">' + know + '</div><div class="c-stat-l">Known</div></div>' +
        '<div class="c-stat"><div class="c-stat-n c-learning">' + learning + '</div><div class="c-stat-l">Still learning</div></div>' +
        (unseen ? '<div class="c-stat"><div class="c-stat-n" style="color:var(--text-muted)">' + unseen + '</div><div class="c-stat-l">Unseen</div></div>' : '') +
      '</div>' +
      '<div class="complete-btns">' +
        studyAgainBtn +
        '<button class="c-btn-sec" onclick="restartSame()">Restart same deck</button>' +
        '<button class="c-btn-sec" onclick="showSetupScreen()">← Back to Setup</button>' +
      '</div>' +
    '</div>';
}

function doStudyLearning() {
  const learningFiles = session.roundFiles.filter(f => getStatus(f) === 'learning');
  showCardScreen();
  startRound([...learningFiles], session.round + 1);
}
function restartSame() {
  const group = session.settings.groupFilter;
  const files = group === 'all' ? [...ALL_FILES] : buildGroupFiles(group);
  showCardScreen();
  startRound(files, 1);
}

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleMode() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  const saved = localStorage.getItem('theme');
  if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
  document.addEventListener('click', e => {
    document.querySelectorAll('.nav-dropdown.open').forEach(d => {
      if (!d.parentElement.contains(e.target)) d.classList.remove('open');
    });
  });
  const groupParam = new URLSearchParams(location.search).get('group');
  showSetupScreen(groupParam);
})();
</script>

<script src="assets/nav.js"></script>
